    <!-- Static content for crawlers that do not run JavaScript. Replaced by the app on load. -->
    <noscript>
      <header>
        <h1>The software factory for your coding agents</h1>
        <p>
          You approve the plan before any code is written. Your agent builds it in small, tested steps, and an independent check compares it with what you asked.
        </p>
      </header>
      <main>
        <section>
          <h2>How a request becomes a reviewed change</h2>
          <ul>
            <li>Your agent writes the plan as short documents you approve one by one in the Cockpit: frame, research, design, outline. Designs come with diagrams and clickable mockups.</li>
            <li>Smaller, cheaper models build it in vertical slices. Each slice starts with a failing test and runs end to end before the next one.</li>
            <li>Optional steps then simplify the whole change, add the tests it lacks, review it for security and update the docs. After that, an AI that did not write the code checks it against your request, with evidence.</li>
            <li>You review the finished change with its evidence and pull request, and approve it. Bugs and small changes take shorter routes, and product managers can plan with a PRD and a TDD.</li>
            <li>With a Team plan, your team reviews the plan and the finished change in their own Cockpit; people outside the team comment through a link.</li>
          </ul>
        </section>
        <section>
          <h2>Install</h2>
          <pre><code>curl -fsSL https://qualitylayer.dev/install.sh | bash</code></pre>
          <p>Native Windows support arrives with the next release. In PowerShell:</p>
          <pre><code>irm https://qualitylayer.dev/install.ps1 | iex</code></pre>
          <p>Then type /ql and the problem in Claude Code, or $ql in Codex, in the terminal, desktop app or IDE. Any agent that supports skills works.</p>
        </section>
