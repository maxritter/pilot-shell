    <noscript>
      <header>
        <h1>The software factory for your coding agents</h1>
        <p>
          You approve one plan before any code is written. Your agent builds it test first in its own terminal, app or editor, and an AI that did not write the code checks the result against your request.
        </p>
      </header>
      <main>
        <section>
          <h2>How a request becomes a reviewed change</h2>
          <ul>
            <li>Discuss: describe the change. Your agent reads the code, then asks each decision in the App, and its terminal shows a single line while it waits. Questions come in batches in Your turn, each with its recommendation. Answer in any order; each answer reaches the agent immediately.</li>
            <li>Plan: answer unresolved choices in Your turn, then read the complete plan with its diagrams, design and proposed outcomes. Your agent handles technical review findings. Approve Plan or Give feedback from the header before any code is written. Undo is available for five seconds after an answer.</li>
            <li>Implement: the App opens with your Build defaults and one command that starts the build. From there your agent works on its own until the final review. Every task starts with a failing test, and QualityLayer records every test run.</li>
            <li>Verify: polish and security review run side by side, then an AI that did not write the code checks every point of your request, with evidence.</li>
            <li>Review: the App asks the few items left, and you approve the finished change with its proof, then create the pull request.</li>
            <li>Designs: ask your agent to draw a page, open it full size in the App and comment on a spot. Designs never leave your computer.</li>
            <li>With a Team plan, teammates answer questions about the plan, with their own agent if they like, and review the change in their own App.</li>
          </ul>
        </section>
        <section>
          <h2>Install</h2>
          <p>Download the QualityLayer App for macOS, Windows or Linux at <a href="https://qualitylayer.dev/download">qualitylayer.dev/download</a>. On a server, in WSL or in a container, install the command line:</p>
          <pre><code>curl -fsSL https://qualitylayer.dev/install.sh | bash</code></pre>
          <p>Then type /ql and the problem in Claude Code, or $ql in Codex, in the terminal, desktop app or IDE.</p>
