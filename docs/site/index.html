      <header>
        <p>Quality by design</p>
        <h1>The software factory with you in the loop</h1>
        <p>
          Your agent draws up each change as diagrams and clickable designs. You and your team agree on the plan; your agents build it and check every point of your request.
        </p>
        <figure>
          <blockquote><p>“With QualityLayer, developing software with agents finally feels like doing real engineering again.”</p></blockquote>
          <figcaption>An engineer who uses QualityLayer</figcaption>
        </figure>
        <pre><code>Plan usage billing with safe retries.</code></pre>
        <p>Example request for + New; no task is submitted. <a href="/download">Download the App</a> · <a href="/pricing">See pricing</a></p>
      </header>
      <main>
        <section>
          <h2>How a request becomes a reviewed change</h2>
          <ul>
            <li>Discuss: describe the change. Your agent reads the code, then asks each decision in the App, and its terminal shows a single line while it waits. Questions come in batches in Your turn, each with its recommendation. Answer in any order; each answer reaches the agent immediately.</li>
            <li>Research: agents read the code without your request in front of them, so the plan rests on how it works today. When the code leaves real choices open, they reach you as one more batch in Your turn.</li>
            <li>Plan: read the complete plan with its diagrams, artifact, the contracts the build is held to and proposed outcomes. Another agent reads it first when it can, and your agent folds in what it found. Approve Plan or Give feedback from the header before any code is written. Undo is available for five seconds after an answer.</li>
            <li>Outline: after you approve the Plan and start the build, your agent cuts it into slices, each with the scenario that proves it. Nothing to approve here.</li>
            <li>Implement: start the build from the approved Plan, in a new App session, an existing session or your terminal. From there your agent works until the final review. Every task starts with a failing test, and QualityLayer records every test run.</li>
            <li>Verify: six checks in a fixed order. Polish and security review run side by side, then your project's checks, then the independent review checks every point of your request, with evidence: by an AI that did not write the code on a risky change, by the build session on any other. A second opinion reads a risky change.</li>
            <li>Review: the App asks the few items left, and you approve the finished change with its proof, then create the pull request.</li>
            <li>Artifacts: ask your agent to draw a page, open it full size in the App and comment on a spot. Artifacts stay local unless you explicitly include them in an encrypted share.</li>
            <li>With a Team plan, teammates answer questions about the plan, with their own agent if they like, and review the change in their own App.</li>
          </ul>
