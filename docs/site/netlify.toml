[build]
  command = "bash build-all.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Docs and blog are static (Docusaurus) — no redirect
[[redirects]]
  from = "/docs/*"
  to = "/docs/:splat"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200

# SPA redirect for landing page
[[redirects]]
  from = "/cockpit-demo/*"
  to = "/cockpit-demo/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for better SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prerender for better SEO - renders pages for bots/crawlers
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Enable Netlify's bot prerendering (free tier supported)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
