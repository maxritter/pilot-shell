<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="254" viewBox="-2 -2 1004 254" role="img" aria-label="Diagnosis of a bug: how to reproduce it, its root cause in the code, and the behaviour the fix must have"><title>Diagnosis of a bug: how to reproduce it, its root cause in the code, and the behaviour the fix must have</title><rect x="0" y="0" width="310" height="246" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1"/><rect x="0" y="0" width="310" height="4" rx="2" fill="#f85149"/><text x="18" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Reproduction</text><path d="M314 123 L336 123" stroke="#9198a1" stroke-width="1.8"/><path d="M329 118 l7 5 l-7 5" fill="none" stroke="#9198a1" stroke-width="1.8"/><rect x="340" y="0" width="310" height="246" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1"/><rect x="340" y="0" width="310" height="4" rx="2" fill="#e8b04f"/><text x="358" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Root cause</text><path d="M654 123 L676 123" stroke="#9198a1" stroke-width="1.8"/><path d="M669 118 l7 5 l-7 5" fill="none" stroke="#9198a1" stroke-width="1.8"/><rect x="680" y="0" width="310" height="246" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1"/><rect x="680" y="0" width="310" height="4" rx="2" fill="#3fb950"/><text x="698" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Behaviour contract</text><rect x="18" y="52" width="274" height="96" rx="8" fill="#0d1117" stroke="#3d444d"/><text x="32" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#9198a1" text-anchor="start">$ open /reports?page=2</text><text x="32" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#e6edf3" text-anchor="start">  shows 49 of 50 rows</text><path d="M33 119 l10 10 M43 119 l-10 10" stroke="#f85149" stroke-width="2.4" stroke-linecap="round"/><text x="52" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f85149" text-anchor="start">The last row is missing</text><text x="18" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Happens on every page but the first.</text><rect x="358" y="52" width="274" height="96" rx="8" fill="#0d1117" stroke="#3d444d"/><rect x="372" y="68" width="200" height="6" rx="3" fill="#3d444d"/><rect x="372" y="82" width="150" height="6" rx="3" fill="#3d444d"/><rect x="364" y="94" width="262" height="24" rx="5" fill="#2a2112"/><text x="372" y="111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e8b04f" text-anchor="start">limit = pageSize - 1</text><rect x="372" y="128" width="170" height="6" rx="3" fill="#3d444d"/><text x="358" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">An off-by-one in the page query.</text><text x="358" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5da3e5" text-anchor="start">api/reports/query.ts:57</text><path d="M698 64 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="722" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start">Every page shows all its rows</text><path d="M698 104 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="722" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start">The last page may be shorter</text><path d="M698 144 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="722" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start">Page size stays 50</text><text x="698" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Fix: one test, one line.</text></svg>
