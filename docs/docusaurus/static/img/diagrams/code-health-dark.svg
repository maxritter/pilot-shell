<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="Code health: edit, check locally, review each finding and verify the change" style="background:#0d1117"><title>Code health: from edited files to reviewed findings</title><line x1="24" x2="304" y1="58" y2="58" stroke="#5da3e5" stroke-width="3"/><text x="24" y="37" fill="#5da3e5" font-size="15" font-weight="650" font-family="system-ui,sans-serif">1</text><text x="24" y="100" fill="#e6edf3" font-size="23" font-weight="650" font-family="system-ui,sans-serif">Edit code</text><text x="24" y="139" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">Your agent changes</text><text x="24" y="166" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">the project files.</text><line x1="340" x2="620" y1="58" y2="58" stroke="#b49aed" stroke-width="3"/><text x="340" y="37" fill="#b49aed" font-size="15" font-weight="650" font-family="system-ui,sans-serif">2</text><text x="340" y="100" fill="#e6edf3" font-size="23" font-weight="650" font-family="system-ui,sans-serif">Check locally</text><text x="340" y="139" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">Qlty reports structure,</text><text x="340" y="166" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">complexity and duplication.</text><line x1="656" x2="936" y1="58" y2="58" stroke="#5da3e5" stroke-width="3"/><text x="656" y="37" fill="#5da3e5" font-size="15" font-weight="650" font-family="system-ui,sans-serif">3</text><text x="656" y="100" fill="#e6edf3" font-size="23" font-weight="650" font-family="system-ui,sans-serif">Review the finding</text><text x="656" y="139" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">Fix the problem, or keep</text><text x="656" y="166" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">a specific review reason.</text><path d="M300 106h24m-7-6 7 6-7 6" stroke="#9198a1" fill="none" stroke-width="2"/><path d="M616 106h24m-7-6 7 6-7 6" stroke="#9198a1" fill="none" stroke-width="2"/><line x1="24" x2="936" y1="213" y2="213" stroke="#3d444d"/><text x="24" y="255" fill="#e6edf3" font-size="21" font-weight="650" font-family="system-ui,sans-serif">Then verify the change</text><text x="24" y="288" fill="#9198a1" font-size="17" font-weight="400" font-family="system-ui,sans-serif">Run the affected tests. Acknowledging a finding keeps the reason; it does not fix code.</text><text x="24" y="322" fill="#9198a1" font-size="16" font-weight="400" font-family="system-ui,sans-serif">Automatic checks cover edited files. Ask your agent for a broader project review.</text></svg>