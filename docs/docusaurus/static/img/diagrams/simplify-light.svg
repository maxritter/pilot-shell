<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="304" viewBox="-2 -2 1004 304" role="img" aria-label="Simplify: two near-copies merged, existing code reused, a wrapper removed, one commit each, with the same behaviour"><title>Simplify: two near-copies merged, existing code reused, a wrapper removed, one commit each, with the same behaviour</title><rect x="0" y="0" width="400" height="230" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="start">Before</text><rect x="18" y="46" width="230" height="50" rx="8" fill="#fff4dc" stroke="#e0a43a"/><text x="30" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">writeCsvReport()</text><rect x="30" y="76" width="180" height="4" rx="3" fill="#d0d7de"/><rect x="30" y="85" width="150" height="4" rx="3" fill="#d0d7de"/><rect x="18" y="106" width="230" height="50" rx="8" fill="#fff4dc" stroke="#e0a43a"/><text x="30" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">writeCsvExport()</text><rect x="30" y="136" width="180" height="4" rx="3" fill="#d0d7de"/><rect x="30" y="145" width="150" height="4" rx="3" fill="#d0d7de"/><text x="258" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9a5b00" text-anchor="start">near-copies</text><rect x="18" y="166" width="230" height="44" rx="8" fill="#ffffff" stroke="#cf222e" stroke-dasharray="4 3"/><text x="30" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#59636e" text-anchor="start">exportWrapper()</text><text x="258" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cf222e" text-anchor="start">only passes through</text><path d="M404 115 L470 115" stroke="#127a6e" stroke-width="1.8"/><path d="M463 110 l7 5 l-7 5" fill="none" stroke="#127a6e" stroke-width="1.8"/><text x="437" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#127a6e" text-anchor="middle">Simplify</text><rect x="472" y="0" width="528" height="230" rx="12" fill="#f6f8fa" stroke="#127a6e" stroke-width="1.5"/><text x="490" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="start">After</text><rect x="490" y="46" width="250" height="50" rx="8" fill="#e3f4f1" stroke="#127a6e"/><text x="502" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">writeCsv(rows, columns)</text><rect x="502" y="76" width="190" height="4" rx="3" fill="#d0d7de"/><text x="490" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">One pass over the whole change:</text><circle cx="498" cy="148" r="3.5" fill="#127a6e"/><text x="510" y="152.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">merge the two writers</text><text x="980" y="152.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="end">commit</text><circle cx="498" cy="174" r="3.5" fill="#127a6e"/><text x="510" y="178.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">reuse formatDate()</text><text x="980" y="178.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="end">commit</text><circle cx="498" cy="200" r="3.5" fill="#127a6e"/><text x="510" y="204.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">remove the pass-through wrapper</text><text x="980" y="204.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8c959f" text-anchor="end">commit</text><rect x="0" y="248" width="1000" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><path d="M16 272 l4 4 l8 -9" fill="none" stroke="#1a7f37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#1f2328" text-anchor="start">Same behaviour: every test and scenario still passes. A simplification that broke something is undone.</text></svg>
