name: App toolchain
description: >
  What the QualityLayer App needs on a runner: the system libraries Tauri builds and runs
  with (Linux), a Rust toolchain and the Tauri command line. The release builds its packages
  with this, and the proof workflow builds its test packages with it, so a toolchain that
  cannot build a package fails in the proof first.

runs:
  using: composite
  steps:
    # The build libraries, and what a window needs to run under a virtual display (xvfb) and
    # what an AppImage needs to start (FUSE). The mirror options bound every download.
    - name: System libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        APT_OPTS=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
          -o Acquire::ForceIPv4=true
        )
        sudo apt-get "${APT_OPTS[@]}" update
        sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
          build-essential curl file patchelf libssl-dev libxdo-dev librsvg2-dev \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libfuse2 xvfb xauth

    - name: Rust
      shell: bash
      run: |
        if command -v rustup >/dev/null 2>&1; then
          rustup toolchain install stable --profile minimal
          rustup default stable
        elif [ "$RUNNER_OS" != Windows ]; then
          curl -fsSL --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        else
          echo "::error::no rustup on this Windows runner"
          exit 1
        fi
        "$HOME/.cargo/bin/cargo" --version

    - name: Cached Tauri command line
      id: tauri-cli
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/cargo-tauri
          ~/.cargo/bin/cargo-tauri.exe
        key: cargo-tauri-2.12.1-${{ runner.os }}-${{ runner.arch }}

    - name: Tauri command line
      if: steps.tauri-cli.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo install tauri-cli --version 2.12.1 --locked

    - name: Cached crates
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qualitylayer/app/**/Cargo.lock') }}
        restore-keys: cargo-crates-${{ runner.os }}-${{ runner.arch }}-
