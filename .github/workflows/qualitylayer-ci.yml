name: QualityLayer CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "qualitylayer/**"
      - "docs/site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/qualitylayer-ci.yml"
      - ".github/scripts/check_qualitylayer_encrypted.sh"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "qualitylayer/**"
      - "docs/site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/qualitylayer-ci.yml"
      - ".github/scripts/check_qualitylayer_encrypted.sh"

permissions:
  contents: read

concurrency:
  group: qualitylayer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaintext-guard:
    name: Plaintext guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      # Runs against the locked checkout on purpose: what this job sees is
      # exactly what the public repository serves.
      - name: Check the encrypted paths are encrypted
        run: bash .github/scripts/check_qualitylayer_encrypted.sh

  # The whole suite, every file, on Linux and macOS on every push. Each shard holds about the same
  # recorded seconds (scripts/test-timings.json), so every job ends within ten minutes: three on
  # Linux, five on the slower 3-core macOS runner. Windows runs its own suites below. GitHub runs
  # at most 20 jobs of this account at once (5 on macOS), so no more shards than that needs.
  test:
    name: Typecheck, lint, test (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: plaintext-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 3 }
          - { os: ubuntu-latest, shard: 2, shards: 3 }
          - { os: ubuntu-latest, shard: 3, shards: 3 }
          - { os: macos-14, shard: 1, shards: 5 }
          - { os: macos-14, shard: 2, shards: 5 }
          - { os: macos-14, shard: 3, shards: 5 }
          - { os: macos-14, shard: 4, shards: 5 }
          - { os: macos-14, shard: 5, shards: 5 }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # The suites run the site's real handlers on the in-process database (PGlite) it ships.
      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Install the pinned native Claude Code for mod tests
        run: bash .github/workflows/scripts/setup-claude-code.sh "${RUNNER_TEMP:?}/ql-native-claude"

      - name: Typecheck
        working-directory: qualitylayer
        run: bun run typecheck

      - name: Lint
        working-directory: qualitylayer
        run: bun run lint

      # One process per test file; the runner builds the binary first. No test
      # reaches the network: Polar, the trial service and releases are local.
      # tests/server/cockpit-release.test.ts builds a release binary and needs its Cockpit
      # to draw in the runner's Chrome: no Chrome is a failure here, not a skip.
      - name: Test
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
        run: bun run test --shard ${{ matrix.shard }}/${{ matrix.shards }}

  # Once per system, not once per test shard: the demo is the same in every shard.
  overflow:
    name: No text overflows a control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: plaintext-guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # Every Cockpit view of the demo, at three widths, in Chrome: no text spills out of a
      # button, tab, badge or menu item. The self-test first proves the check still catches one.
      - name: No text overflows a control
        working-directory: qualitylayer
        run: |
          bun scripts/check-overflow.ts --self-test --require-render
          bun run check:overflow -- --require-render

  site:
    name: Site API and pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plaintext-guard
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      # docs/site/api is encrypted; the route tests need its source.
      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Typecheck the app, the build config and the API
        working-directory: docs/site
        run: npm run typecheck

      - name: Test
        working-directory: docs/site
        run: npm test

  # Every push runs the Windows-specific suites and a short end-to-end smoke set natively on both
  # Windows runners, split so each job ends within ten minutes. The full end-to-end suite runs on
  # Linux and macOS above on every push, and on Windows nightly in qualitylayer-windows-nightly.yml
  # (CLI calls that start Windows PowerShell make it far slower there than one push should wait).
  windows:
    name: Native Windows runtime (${{ matrix.os }}, shard ${{ matrix.shard }}/6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    needs: plaintext-guard
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: pwsh
    steps:
      # Git checks out CRLF by default on Windows; the encrypted files must arrive byte for byte.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      # One filter process instead of git-crypt's one process per file (minutes under msys2).
      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # The team suites run the site's real handlers on the in-process database (PGlite) it ships.
      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Windows suites and end-to-end smoke
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
        run: bun run test --shard ${{ matrix.shard }}/6 tests/windows tests/core/platform.test.ts tests/core/team-keys.test.ts tests/server/lock.test.ts tests/cli/hook-prompt.test.ts tests/core/install/mod.test.ts tests/scripts/chrome-shutdown.test.ts tests/e2e/statusline.test.ts tests/e2e/sessions.test.ts tests/e2e/cockpit-diagrams.test.ts tests/e2e/research.test.ts tests/e2e/documents.test.ts

      # The Plan gate starts the other agent's review detached, through the compiled binary.
      - name: Compiled reviewer starts and fails safely
        if: matrix.shard == 5
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
        run: bun run test tests/e2e/cross-review.test.ts -t 'opening the Plan gate starts|a reviewer that fails'

      - name: Release Cockpit draws on Windows
        if: matrix.shard == 6
        working-directory: qualitylayer
        run: bun scripts/check-cockpit.ts --build --require-render
