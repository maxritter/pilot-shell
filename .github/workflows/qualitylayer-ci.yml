name: QualityLayer CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "qualitylayer/**"
      - "docs/site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/qualitylayer-ci.yml"
      - ".github/scripts/check_qualitylayer_encrypted.sh"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "qualitylayer/**"
      - "docs/site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/qualitylayer-ci.yml"
      - ".github/scripts/check_qualitylayer_encrypted.sh"

permissions:
  contents: read

concurrency:
  group: qualitylayer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaintext-guard:
    name: Plaintext guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      # Runs against the locked checkout on purpose: what this job sees is
      # exactly what the public repository serves.
      - name: Check the encrypted paths are encrypted
        run: bash .github/scripts/check_qualitylayer_encrypted.sh

  test:
    name: Typecheck, lint, test (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: plaintext-guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # The suites run the site's real handlers on the in-process database (PGlite) it ships.
      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Install the pinned native Claude Code for mod tests
        run: bash .github/workflows/scripts/setup-claude-code.sh "${RUNNER_TEMP:?}/ql-native-claude"

      - name: Typecheck
        working-directory: qualitylayer
        run: bun run typecheck

      - name: Lint
        working-directory: qualitylayer
        run: bun run lint

      # One process per test file; the runner builds the binary first. No test
      # reaches the network: Polar, the trial service and releases are local.
      # tests/server/cockpit-release.test.ts builds a release binary and needs its Cockpit
      # to draw in the runner's Chrome: no Chrome is a failure here, not a skip.
      - name: Test
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
        run: bun run test --shard ${{ matrix.shard }}/4

      # Every Cockpit view of the demo, at three widths, in Chrome: no text spills out of a
      # button, tab, badge or menu item. The self-test first proves the check still catches one.
      - name: No text overflows a control
        working-directory: qualitylayer
        run: |
          bun scripts/check-overflow.ts --self-test --require-render
          bun run check:overflow -- --require-render

  site:
    name: Site API and pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plaintext-guard
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      # docs/site/api is encrypted; the route tests need its source.
      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Typecheck the app, the build config and the API
        working-directory: docs/site
        run: npm run typecheck

      - name: Test
        working-directory: docs/site
        run: npm test

  windows:
    name: Native Windows runtime (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: plaintext-guard
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: pwsh
    steps:
      # Git for Windows checks out CRLF by default; git-crypt (msys2's git) then sees the whole
      # tree as modified and refuses to unlock.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup git-crypt
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          install: git git-crypt
          update: true
          path-type: inherit

      - name: Unlock repository
        shell: msys2 {0}
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # The suites run the site's real handlers on the in-process database (PGlite) it ships.
      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      # Bun has no native Windows arm64 build: under x64 emulation it installs TypeScript's x64
      # compiler, which the runner's arm64 Node cannot find. Under Bun, tsc asks for the x64 one.
      - name: Typecheck
        working-directory: qualitylayer
        run: bun --bun run typecheck

      - name: Check Windows platform probes early
        if: matrix.shard == 1
        working-directory: qualitylayer
        run: bun test --timeout 180000 tests/core/platform.test.ts

      - name: Check detached reviewer startup early
        if: matrix.shard == 1
        working-directory: qualitylayer
        run: bun test --timeout 180000 tests/windows/review-startup.test.ts

      - name: Windows workflows and installer
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
        run: bun run test --shard ${{ matrix.shard }}/4 tests/e2e tests/windows tests/core/platform.test.ts tests/core/team-keys.test.ts tests/server/lock.test.ts tests/cli/hook-prompt.test.ts tests/core/install/mod.test.ts tests/scripts/chrome-shutdown.test.ts

      - name: Release Cockpit draws on Windows
        working-directory: qualitylayer
        run: bun scripts/check-cockpit.ts --build --require-render

      - name: Measure native compilation tradeoffs
        working-directory: qualitylayer
        run: bun scripts/benchmark-compile.ts --samples 7

      - name: Keep the native performance measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compile-benchmark-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: qualitylayer/dist/compile-benchmark.json
          retention-days: 7
