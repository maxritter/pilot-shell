---
name: Release

# QualityLayer 12. The gates are Pilot Shell's: supply-chain, Trivy, tests,
# a manual `production` approval and build provenance. What is built is one
# binary per platform plus its checksum, and install.sh with its checksum
# (Pilot Shell 11's updater verifies install.sh.sha256 at the tag).
#
# `dev` publishes 12.x prereleases (beta); `main` publishes releases once v12 is
# merged. Pilot Shell 11 keeps its own pipeline on the 11.x branch.
#
# One revision S ships: it is tested, built, deployed and released. Binaries come
# last. The publishing job deploys the site at S, uploads the release's workflow
# texts to the store behind that site and proves both answer, and only then creates
# the GitHub release, so no binary is ever published that cannot fetch its texts.

"on":
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (e.g. 12.0.0-beta.1)"
        required: true
        type: string

jobs:
  check-trigger:
    name: Check Release Trigger
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check commit messages
        id: check
        run: |
          case "$GITHUB_REF_NAME" in
            main | dev) ;;
            *) echo "::error::Only main and dev release, not $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger - proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every commit since the last release tag, not only the tip: a merge
          # commit on top must not hide a fix:/feat: underneath it.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMIT_MSGS=$(git log "$RANGE" --pretty=%B)
          if echo "$COMMIT_MSGS" | grep -qE "(^|\* )(fix|feat)(\([^)]*\))?!?:"; then
            echo "Release commit found in $RANGE"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No release trigger commit in $RANGE - skipping"
          echo "should_run=false" >> "$GITHUB_OUTPUT"

  supply-chain-gate:
    # Cross-workflow `needs:` does not link supply-chain.yml to this workflow;
    # poll the Checks API for its result on the release SHA instead.
    name: Supply-Chain Gate
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const deadline = Date.now() + 12 * 60 * 1000;
            let last = null;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                ...context.repo, ref: context.sha
              });
              const sc = data.check_runs.find(r => r.name === 'supply-chain');
              last = sc;
              if (sc && sc.status === 'completed') {
                if (sc.conclusion === 'success') return;
                core.setFailed(
                  `supply-chain check concluded ${sc.conclusion} for ${context.sha}; release blocked.`
                );
                return;
              }
              await sleep(20000);
            }
            core.setFailed(
              `supply-chain check did not complete within 12m for ${context.sha} ` +
              `(last status: ${last?.status ?? 'missing'}); release blocked.`
            );

  security-scan:
    name: Security Scan (Trivy)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          # Pinned: this action release defaults to a Trivy version whose release was removed.
          version: 'v0.72.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          # With format: sarif the severity filter is dropped unless this is true.
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'node_modules,qualitylayer/node_modules,docs/site/api,docs/site/node_modules,docs/docusaurus/node_modules'
          trivyignores: '.trivyignore'
          format: 'sarif'
          output: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Trivy SARIF to code-scanning (best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: trivy-results.sarif

  test:
    name: QualityLayer Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Check qualitylayer/ is encrypted in the public tree
        run: bash scripts/check_qualitylayer_encrypted.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, test
        working-directory: qualitylayer
        run: |
          bun run typecheck
          bun run lint
          bun run test

  prepare-release:
    name: Prepare Release
    # semantic-release checks, even in a dry run, that it may push: with a read-only token it
    # stops before naming a version.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      current_version: ${{ steps.current.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      - name: Get current version
        id: current
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Check for release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g semantic-release @semantic-release/git @semantic-release/exec
          SR_OUT=/tmp/sr-output.txt
          # An error is not "no release": it fails the run with semantic-release's own words.
          if ! npx semantic-release --dry-run > "$SR_OUT" 2>&1; then
            tail -n 60 "$SR_OUT"
            exit 1
          fi
          if grep -q "next release version" "$SR_OUT"; then
            VERSION=$(grep "next release version" $SR_OUT \
              | grep -oP '\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?' | head -1)
            echo "Will release version: $VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No release needed"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # Releases from main wait for the go-live: they need a store of their own, and
      # must never fall back to the beta's.
      - name: Check the go-live is configured
        if: steps.check.outputs.should_release == 'true' && github.ref_name == 'main'
        env:
          PROD_KV_REST_API_URL: ${{ secrets.PROD_KV_REST_API_URL }}
          PROD_KV_REST_API_TOKEN: ${{ secrets.PROD_KV_REST_API_TOKEN }}
        run: |
          if [ -z "$PROD_KV_REST_API_URL" ] || [ -z "$PROD_KV_REST_API_TOKEN" ]; then
            echo "::error::go-live not configured: set the PROD_KV_REST_API_URL and PROD_KV_REST_API_TOKEN secrets before releasing from main"
            exit 1
          fi

  build:
    name: Build QualityLayer (4 targets)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # Release builds trust only the trial service's key (no development key).
      - name: Build release binaries
        working-directory: qualitylayer
        env:
          QUALITYLAYER_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: bun run build --all

      # Release binaries carry no phase texts; qualitylayer.dev serves them. Only the
      # digest of the served texts leaves this job: the publishing job rebuilds the
      # texts from the same commit and must arrive at it, and the texts themselves never
      # become an artifact.
      - name: Digest of the workflow texts
        id: bundle
        working-directory: qualitylayer
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest in: $out"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          rm -f "${RUNNER_TEMP:?}/workflow-bundle.json"

      - name: Smoke-test the Linux x64 binary
        env:
          EXPECTED: ${{ needs.prepare-release.outputs.version }}
        run: |
          ACTUAL=$(qualitylayer/dist/release/qualitylayer-linux-x64 --version)
          echo "built: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Collect release assets
        run: |
          mkdir -p release
          cp qualitylayer/dist/release/qualitylayer-* release/
          cp install.sh release/install.sh
          (cd release && sha256sum install.sh > install.sh.sha256)
          (cd release && sha256sum -c ./*.sha256)

      # Only binaries, checksums and install.sh may ever be attached: no
      # source, no source maps, nothing from the encrypted tree.
      - name: Guard the asset list
        run: |
          cd release
          ls -la
          ALLOWED='^(qualitylayer-(darwin|linux)-(arm64|x64)(\.sha256)?|install\.sh(\.sha256)?)$'
          BAD=$(find . -type f -printf '%f\n' | grep -vE "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "Refusing to publish unexpected assets:"
            echo "$BAD"
            exit 1
          fi
          [ "$(find . -type f | wc -l)" -eq 10 ]

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-release
          path: release/
          retention-days: 1

  approve-release:
    name: Approve Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare-release, test, build, security-scan]
    if: needs.prepare-release.outputs.should_release == 'true'
    environment: production
    steps:
      - name: Display release details for approval
        run: |
          {
          echo "## Release Approval Required"
          echo ""
          echo "| Current | → | New |"
          echo "|---------|---|-----|"
          echo "| v${{ needs.prepare-release.outputs.current_version }} | → | **v${{ needs.prepare-release.outputs.version }}** |"
          echo ""
          echo "- Security scan (Trivy) passed"
          echo "- QualityLayer typecheck, lint and tests passed"
          echo "- Four binaries built, checksummed and asset-guarded"
          echo "- After approval: site deployed, workflow texts uploaded and probed, then the release is created"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare-release, build, approve-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
      VERCEL_PROJECT_ID: prj_TXccrJI83HyNvQUZxqStUFgus9NB
    steps:
      # The tested revision, never the branch tip: what is released is what was built.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Vercel names a preview deployment after the branch it finds in git.
          git checkout -B "${{ github.ref_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      # A commit may have landed since the version was decided. The version this job
      # would publish must be the one that was built and approved.
      - name: Check the version again
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/exec
          SR_OUT="${RUNNER_TEMP:?}/sr-output.txt"
          npx semantic-release --dry-run 2>&1 | tee "$SR_OUT" || true
          NEXT=$(grep "next release version" "$SR_OUT" \
            | grep -oP '\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?' | head -1 || true)
          if [ "$NEXT" != "$VERSION" ]; then
            echo "::error::semantic-release would publish '${NEXT}', the build was approved as '${VERSION}'"
            exit 1
          fi

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # Rebuilt from source at this commit; it must be the texts the build job hashed.
      - name: Rebuild the workflow texts
        working-directory: qualitylayer
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.bundle_digest }}
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::the workflow texts differ from the build's: $digest, expected $EXPECTED_DIGEST"
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BUNDLE=${RUNNER_TEMP:?}/workflow-bundle.json" >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        run: npm install -g vercel

      # main serves production; dev is a Preview of the same project, named by its branch.
      - name: Deploy the site at this commit
        id: deploy
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            DEPLOY_URL=$(vercel deploy --token="$VERCEL_TOKEN" --prod)
          else
            DEPLOY_URL=$(vercel deploy --token="$VERCEL_TOKEN")
          fi
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      # The domain moves only to a deployment of the branch's tip: a newer commit that
      # landed meanwhile keeps it.
      - name: Point qualitylayer.dev at the beta
        if: github.ref_name == 'dev'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          git fetch --quiet origin dev
          if [ "$(git rev-parse origin/dev)" != "$GITHUB_SHA" ]; then
            echo "::warning::dev moved past $GITHUB_SHA; qualitylayer.dev stays on the newer deployment"
            exit 0
          fi
          for domain in qualitylayer.dev www.qualitylayer.dev; do
            vercel alias set "$DEPLOY_URL" "$domain" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          done

      - name: Variables and routes of the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            bash docs/site/scripts/check-deploy.sh --env production
          else
            bash docs/site/scripts/check-deploy.sh --env preview --branch "$GITHUB_REF_NAME"
          fi
          bash docs/site/scripts/check-deploy.sh "$DEPLOY_URL"

      - name: Upload the workflow texts and read them back
        env:
          BETA_KV_REST_API_URL: ${{ secrets.BETA_KV_REST_API_URL }}
          BETA_KV_REST_API_TOKEN: ${{ secrets.BETA_KV_REST_API_TOKEN }}
          PROD_KV_REST_API_URL: ${{ secrets.PROD_KV_REST_API_URL }}
          PROD_KV_REST_API_TOKEN: ${{ secrets.PROD_KV_REST_API_TOKEN }}
        run: |
          # The store of the environment being released to, never the other one.
          if [ "$GITHUB_REF_NAME" = main ]; then
            KV_REST_API_URL="$PROD_KV_REST_API_URL"
            KV_REST_API_TOKEN="$PROD_KV_REST_API_TOKEN"
          else
            KV_REST_API_URL="$BETA_KV_REST_API_URL"
            KV_REST_API_TOKEN="$BETA_KV_REST_API_TOKEN"
          fi
          export KV_REST_API_URL KV_REST_API_TOKEN
          bash scripts/upload-workflow.sh upload "$VERSION" "$BUNDLE" "$DIGEST"

      - name: A fresh trial gets the texts from the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/upload-workflow.sh probe "$VERSION" "$DEPLOY_URL"

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/qualitylayer-darwin-arm64
            release/qualitylayer-darwin-x64
            release/qualitylayer-linux-arm64
            release/qualitylayer-linux-x64
            release/install.sh

      - name: Prepend the release to CHANGELOG.md
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ needs.prepare-release.outputs.version }} --prepend CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release with semantic-release
        id: semantic-release
        if: github.event_name != 'workflow_dispatch'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The assets below belong to the tag that was built and approved, or to none.
      - name: The release is the one that was built
        if: github.event_name != 'workflow_dispatch'
        env:
          CREATED: ${{ steps.semantic-release.outputs.new_release_version }}
        run: |
          if [ "$CREATED" != "$VERSION" ]; then
            echo "::error::semantic-release created '${CREATED}', expected '${VERSION}'"
            exit 1
          fi

      - name: Create release for manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes \
              --target "${{ github.sha }}" $PRE
          fi

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ((i = 1; i <= 12; i++)); do
            gh release view "v${VERSION}" >/dev/null 2>&1 && break
            [ "$i" -eq 12 ] && { echo "Release v${VERSION} was not created"; exit 1; }
            sleep 5
          done
          gh release upload "v${VERSION}" release/* --clobber
          # The published list must match the guarded one exactly.
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | sort > published.txt
          find release -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt published.txt

  # A clean Linux install of the beta just published, from qualitylayer.dev.
  beta-install:
    name: Beta install
    needs: [publish-release]
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/beta-install.yml
