---
name: Release

# QualityLayer 12. The gates are Pilot Shell's: supply-chain, Trivy, tests,
# a manual `production` approval (releases from main only: a dev prerelease goes out
# without one, through the reviewer-less `beta` environment) and build provenance. What is built is one
# binary per platform plus its checksum, both installers with their checksums
# (Pilot Shell 11's updater verifies install.sh.sha256 at the tag), and the QualityLayer
# App: six packages (a .dmg per Mac, a per-user setup per Windows, an AppImage per Linux),
# each built on its own runner around the binary this run published, signed for the
# updater, and described by latest.json, which is uploaded after everything it names. The
# publishing job also signs a SHA256SUMS over every file (SHA256SUMS.sig, `ssh-keygen -Y sign`
# with RELEASE_SIGNING_KEY); the installers and `qualitylayer update` verify it.
#
# `dev` publishes 12.x prereleases (beta); `main` publishes releases once v12 is
# merged. Pilot Shell 11 keeps its own pipeline on the 11.x branch.
#
# One revision S ships: it is tested, built, deployed and released. Binaries come
# last. The publishing job deploys the site at S, uploads the release's workflow
# texts to the store behind that site and proves both answer, and only then creates
# the GitHub release, so no binary is ever published that cannot fetch its texts.

"on":
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (e.g. 12.0.0-beta.1)"
        required: true
        type: string

jobs:
  check-trigger:
    name: Check Release Trigger
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check commit messages
        id: check
        run: |
          case "$GITHUB_REF_NAME" in
            main | dev) ;;
            *) echo "::error::Only main and dev release, not $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger - proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every commit since the last release tag, not only the tip: a merge
          # commit on top must not hide a fix:/feat:/perf: underneath it. A perf:
          # change is one users feel, so it ships like a fix.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMIT_MSGS=$(git log "$RANGE" --pretty=%B)
          if echo "$COMMIT_MSGS" | grep -qE "(^|\* )(fix|feat|perf)(\([^)]*\))?!?:"; then
            echo "Release commit found in $RANGE"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No release trigger commit in $RANGE - skipping"
          echo "should_run=false" >> "$GITHUB_OUTPUT"

  source-ui-gate:
    # Reuse the standalone UI check on this SHA (qualitylayer-ui.yml: parallel shards, then the one
    # "Source UI browser checks" result); never start a second browser suite here.
    name: Source UI Gate
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const expected = 'Source UI browser checks';
            // The sharded browser suite takes about seven minutes; each shard stops at 15.
            const deadline = Date.now() + 20 * 60 * 1000;
            let latest = null;
            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: context.sha, filter: 'all', per_page: 100
              });
              latest = runs.filter(r => r.name === expected &&
                r.head_sha === context.sha && r.app?.slug === 'github-actions')
                .sort((a, b) => b.id - a.id)[0] ?? null;
              if (latest?.status === 'completed') {
                if (latest.conclusion === 'success') {
                  core.info(`${expected} succeeded for ${context.sha} (check ${latest.id}).`);
                  return;
                }
                core.setFailed(`${expected} concluded ${latest.conclusion} for ${context.sha}; release blocked.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30_000));
            }
            core.setFailed(`${expected} did not succeed within 20m for ${context.sha}; ` +
              `last status ${latest?.status ?? 'missing'}. Release blocked.`);

  supply-chain-gate:
    # Cross-workflow `needs:` does not link supply-chain.yml to this workflow;
    # poll the Checks API for its result on the release SHA instead.
    name: Supply-Chain Gate
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const deadline = Date.now() + 12 * 60 * 1000;
            let last = null;
            while (Date.now() < deadline) {
              // Every page: a release commit carries more check runs than one page holds.
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: context.sha, filter: 'all', per_page: 100
              });
              const sc = runs.filter(r => r.name === 'supply-chain' && r.head_sha === context.sha)
                .sort((a, b) => b.id - a.id)[0];
              last = sc;
              if (sc && sc.status === 'completed') {
                if (sc.conclusion === 'success') return;
                core.setFailed(
                  `supply-chain check concluded ${sc.conclusion} for ${context.sha}; release blocked.`
                );
                return;
              }
              await sleep(20000);
            }
            core.setFailed(
              `supply-chain check did not complete within 12m for ${context.sha} ` +
              `(last status: ${last?.status ?? 'missing'}); release blocked.`
            );

  security-scan:
    name: Security Scan (Trivy)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          # Pinned: this action release defaults to a Trivy version whose release was removed.
          version: 'v0.72.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          # With format: sarif the severity filter is dropped unless this is true.
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'node_modules,qualitylayer/node_modules,docs/site/api,docs/site/node_modules,docs/docusaurus/node_modules'
          trivyignores: '.trivyignore'
          format: 'sarif'
          output: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Trivy SARIF to code-scanning (best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: trivy-results.sarif

  # The tests of the release SHA are the ones CI ran on its push (qualitylayer-ci.yml): every job
  # there ends within ten minutes, so this waits up to fifteen for all of them and reuses their
  # result. Only when they are still missing then does the suite run here, split over parallel
  # jobs (test-fallback). The Windows nightly (qualitylayer-windows-nightly.yml) is not required.
  ci-reuse:
    name: Reuse CI results
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - name: Decide whether to reuse CI or run checks
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks="${RUNNER_TEMP:?}/ci-checks.json"
          required="${RUNNER_TEMP:?}/required-ci-checks.txt"
          wait=900
          printf '%s\n' 'Plaintext guard' 'Site API and pages' > "$required"
          for shard in 1 2 3; do
            printf 'Typecheck, lint, test (ubuntu-latest, shard %s/3)\n' "$shard" >> "$required"
          done
          for shard in 1 2 3 4 5; do
            printf 'Typecheck, lint, test (macos-14, shard %s/5)\n' "$shard" >> "$required"
          done
          for os in ubuntu-latest macos-14; do
            printf 'No text overflows a control (%s)\n' "$os" >> "$required"
          done
          for os in windows-2025 windows-11-arm; do
            for shard in 1 2 3 4 5 6; do
              printf 'Native Windows runtime (%s, shard %s/6)\n' "$os" "$shard" >> "$required"
            done
          done
          started=$(date +%s)
          while true; do
            remaining=$((wait - $(date +%s) + started))
            if [ "$remaining" -le 0 ]; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "Required CI checks still pending or missing after fifteen minutes; run checks"
              exit 0
            fi
            if ! timeout "${remaining}s" gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$checks"; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "CI results unavailable; run checks"
              exit 0
            fi
            if ! state=$(jq -r --arg sha "$GITHUB_SHA" --rawfile required "$required" '
              [.[].check_runs[] | select(.head_sha == $sha and .app.slug == "github-actions")]
              | group_by(.name) | map(max_by(.id)) as $latest
              | ($required | split("\n") | map(select(length > 0))) as $wanted
              | if any($latest[]; . as $run | ($wanted | index($run.name)) != null and $run.status == "completed" and $run.conclusion != "success") then "failed"
                elif all($wanted[]; . as $name | any($latest[]; .name == $name and .status == "completed" and .conclusion == "success")) then "success"
                else "pending" end
            ' "$checks"); then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "CI results could not be read; run checks"
              exit 0
            fi
            case "$state" in
              success)
                echo "reuse=true" >> "$GITHUB_OUTPUT"
                echo "Reuse CI: every required check passed for $GITHUB_SHA"
                exit 0
                ;;
              failed)
                echo "::error::A latest required CI check failed for $GITHUB_SHA; refusing a full-suite fallback"
                exit 1
                ;;
              pending)
                remaining=$((wait - $(date +%s) + started))
                if [ "$remaining" -gt 0 ]; then
                  pause=15
                  if [ "$remaining" -lt "$pause" ]; then pause="$remaining"; fi
                  sleep "$pause"
                fi
                ;;
              *) echo "::error::Unknown CI decision state"; exit 1 ;;
            esac
          done

  # The same suite as CI's Linux jobs, in four parallel shards; only when CI cannot be reused.
  test-fallback:
    name: QualityLayer Tests (fallback, shard ${{ matrix.shard }}/4)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-reuse
    if: needs.ci-reuse.outputs.reuse == 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Check the encrypted paths are encrypted in the public tree
        run: bash .github/scripts/check_qualitylayer_encrypted.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # The suites run the site's real handlers on the in-process database (PGlite) it ships.
      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Install the pinned native Claude Code for mod tests
        run: bash .github/workflows/scripts/setup-claude-code.sh "${RUNNER_TEMP:?}/ql-native-claude"

      - name: Typecheck, lint, test
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          bun run typecheck
          bun run lint
          bun run test --shard "$SHARD/4"

      - name: No text overflows a control
        if: matrix.shard == 1
        working-directory: qualitylayer
        run: |
          bun scripts/check-overflow.ts --self-test --require-render
          bun run check:overflow -- --require-render

  # What Approve Release waits for: CI's results reused, or every fallback shard green.
  test:
    name: QualityLayer Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-trigger, ci-reuse, test-fallback]
    if: always() && needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: CI reused or the fallback passed
        env:
          DECIDED: ${{ needs.ci-reuse.result }}
          REUSE: ${{ needs.ci-reuse.outputs.reuse }}
          FALLBACK: ${{ needs.test-fallback.result }}
        run: |
          if [ "$DECIDED" != success ]; then
            echo "::error::the CI reuse decision concluded $DECIDED"
            exit 1
          fi
          if [ "$REUSE" = true ]; then
            echo "Reused CI: every required check passed for $GITHUB_SHA"
          elif [ "$FALLBACK" = success ]; then
            echo "Every fallback shard passed for $GITHUB_SHA"
          else
            echo "::error::the fallback suite concluded $FALLBACK"
            exit 1
          fi

  prepare-release:
    name: Prepare Release
    # semantic-release checks, even in a dry run, that it may push: with a read-only token it
    # stops before naming a version.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      current_version: ${{ steps.current.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      - name: Get current version
        id: current
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Check for release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g semantic-release @semantic-release/git @semantic-release/exec
          SR_OUT=/tmp/sr-output.txt
          # An error is not "no release": it fails the run with semantic-release's own words.
          if ! npx semantic-release --dry-run > "$SR_OUT" 2>&1; then
            tail -n 60 "$SR_OUT"
            exit 1
          fi
          if grep -q "next release version" "$SR_OUT"; then
            VERSION=$(grep "next release version" $SR_OUT \
              | grep -oP '\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?' | head -1)
            echo "Will release version: $VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No release needed"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # The release's notes are its section of CHANGELOG.md: they go into the GitHub release and the
      # updater's manifest, and from there into the App and the terminal. A version nobody wrote
      # notes for does not go out; this stops before any build, naming the file and the heading.
      - name: The release has notes in CHANGELOG.md
        if: steps.check.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: bash .github/scripts/changelog-section.sh "$VERSION" > /dev/null

  build:
    name: Build QualityLayer (6 targets)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # Release builds trust only the trial service's key (no development key).
      - name: Build release binaries
        working-directory: qualitylayer
        env:
          QUALITYLAYER_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: bun run build --all

      # The binary this run publishes for Linux, started from / with an empty HOME, must
      # serve its own page, script and stylesheet and draw in Chrome. beta.1 to beta.5
      # served a white page; nothing reaches Approve Release past this step any more.
      - name: The release Cockpit draws
        working-directory: qualitylayer
        run: bun scripts/check-cockpit.ts dist/release/qualitylayer-linux-x64 --same-source --require-render

      # Release binaries carry no phase texts; qualitylayer.dev serves them. Only the
      # digest of the served texts leaves this job: the publishing job rebuilds the
      # texts from the same commit and must arrive at it, and the texts themselves never
      # become an artifact.
      - name: Digest of the workflow texts
        id: bundle
        working-directory: qualitylayer
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest in: $out"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          rm -f "${RUNNER_TEMP:?}/workflow-bundle.json"

      - name: Smoke-test the Linux x64 binary
        env:
          EXPECTED: ${{ needs.prepare-release.outputs.version }}
        run: |
          ACTUAL=$(qualitylayer/dist/release/qualitylayer-linux-x64 --version)
          echo "built: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Collect release assets
        run: |
          mkdir -p release
          cp qualitylayer/dist/release/qualitylayer-* release/
          cp install.sh release/install.sh
          cp install.ps1 release/install.ps1
          (cd release && sha256sum install.sh > install.sh.sha256)
          (cd release && sha256sum install.ps1 > install.ps1.sha256)
          (cd release && sha256sum -c ./*.sha256)

      # The command line's files only; the asset guard looks at the whole list once the App's
      # packages have joined it, in assemble-release.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-release
          path: release/
          retention-days: 1

  # One package per system, each built natively around the command line this run built, so
  # the App carries the very binary that is published. The Mac packages are signed with the
  # Developer ID and notarized; every package's update file is signed with the update key.
  app:
    name: App package (${{ matrix.name }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, target: darwin-arm64, os: macos-26 }
          - { name: macos-x64, target: darwin-x64, os: macos-15-intel }
          - { name: windows-x64, target: windows-x64, os: windows-2025 }
          - { name: windows-arm64, target: windows-arm64, os: windows-11-arm }
          - { name: linux-x64, target: linux-x64, os: ubuntu-22.04 }
          - { name: linux-arm64, target: linux-arm64, os: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks out CRLF by default; git-crypt (msys2's git) then sees the whole
      # tree as modified and refuses to unlock.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # The package needs only the App's own sources and its packaging script (the command line
      # comes from this run's build): a sparse checkout leaves the rest encrypted and unread, so
      # unlocking decrypts some 50 files instead of every one (minutes on Windows).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github
            qualitylayer/app
            qualitylayer/scripts

      - name: Install git-crypt
        if: runner.os != 'Windows'
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Setup git-crypt
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          install: git git-crypt
          update: true
          path-type: inherit

      - name: Unlock repository
        if: runner.os != 'Windows'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Unlock repository (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Toolchain for the App (Rust, Tauri, the system libraries)
        uses: ./.github/actions/app-toolchain

      # The App's compiled dependencies, per platform: a release then compiles only what changed
      # instead of every crate (ten minutes on the Intel Mac). Only release runs on main and dev
      # write it; the packages themselves (bundle/) are never cached.
      - name: Cached App build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            qualitylayer/app/src-tauri/target
            qualitylayer/app/launcher/target
            !qualitylayer/app/src-tauri/target/**/bundle
          key: app-target-${{ matrix.target }}-${{ hashFiles('qualitylayer/app/**/Cargo.lock') }}
          restore-keys: app-target-${{ matrix.target }}-

      # The certificate goes into a keychain of its own that lives as long as this job.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP:?}/ql-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "${RUNNER_TEMP:?}/certificate.p12"
          security import "${RUNNER_TEMP:?}/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP:?}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"

      - name: Download the command line this run built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release
          path: release

      - name: Build the package
        working-directory: qualitylayer
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          notarize=()
          if [ "$RUNNER_OS" = macOS ]; then notarize=(--notarize); fi
          bun scripts/app.ts --release "${notarize[@]}" --version "$VERSION" \
            --targets "$TARGET" --cli-dir ../release

      - name: A Mac package is accepted by Gatekeeper
        if: runner.os == 'macOS'
        run: |
          for dmg in qualitylayer/dist/app/release/*.dmg; do
            spctl -a -vv -t install "$dmg" 2>&1 | tee "${RUNNER_TEMP:?}/spctl.txt"
            grep -q "source=Notarized Developer ID" "${RUNNER_TEMP:?}/spctl.txt"
            xcrun stapler validate "$dmg"
          done

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.name }}
          path: qualitylayer/dist/app/release/
          retention-days: 1

  # The whole release list in one place: the command line, the packages, their signatures,
  # their checksums and latest.json. Nothing but these may ever be attached: no source, no
  # source maps, nothing from the encrypted tree.
  assemble-release:
    name: Assemble Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare-release, build, app]
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Download the command line and the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{qualitylayer-release,app-*}"
          path: release
          merge-multiple: true

      # The installers verify a package against its .sha256; the updater verifies the .sig.
      - name: Checksums and the updater's manifest
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          for package in QualityLayer-*.dmg QualityLayer-*-setup.exe QualityLayer-*.AppImage; do
            sha256sum "$package" > "$package.sha256"
          done
          cd ..
          bun qualitylayer/scripts/app.ts --latest-json release --version "$VERSION" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          # The notes ride in the manifest, so the App's update sheet says what the release says.
          bash .github/scripts/changelog-section.sh "$VERSION" > "${RUNNER_TEMP:?}/release-notes.md"
          jq --rawfile notes "${RUNNER_TEMP:?}/release-notes.md" '. + {notes: $notes}' \
            release/latest.json > "${RUNNER_TEMP:?}/latest.json"
          mv "${RUNNER_TEMP:?}/latest.json" release/latest.json
          (cd release && sha256sum -c ./*.sha256)

      - name: Guard the asset list
        run: |
          cd release
          ls -la
          ALLOWED='^(qualitylayer-(darwin|linux)-(arm64|x64)(\.sha256)?|qualitylayer-windows-(arm64|x64)\.exe(\.sha256)?|install\.(sh|ps1)(\.sha256)?|QualityLayer-[0-9][0-9A-Za-z.-]*-(macos-(arm64|x64)\.dmg(\.sha256)?|macos-(arm64|x64)\.app\.tar\.gz(\.sig)?|(x64|arm64)-setup\.exe(\.sha256|\.sig)?|linux-(arm64|x64)\.AppImage(\.sha256|\.sig)?)|latest\.json)$'
          BAD=$(find . -type f -printf '%f\n' | grep -vE "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "Refusing to publish unexpected assets:"
            echo "$BAD"
            exit 1
          fi
          [ "$(find . -type f | wc -l)" -eq 37 ]

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-release-complete
          path: release/
          retention-days: 1

  windows-release:
    name: Native Windows release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    defaults:
      run:
        shell: pwsh
    steps:
      # Git for Windows checks out CRLF by default; git-crypt (msys2's git) then sees the whole
      # tree as modified and refuses to unlock.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      # The job checks the published binary; from the tree it needs only the Cockpit check and the
      # one core module it imports. A sparse checkout decrypts those instead of every file.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github
            qualitylayer/scripts
            qualitylayer/src/core

      - name: Setup git-crypt
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          install: git git-crypt
          update: true
          path-type: inherit

      - name: Unlock repository
        shell: msys2 {0}
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Download exact release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release
          path: release

      - name: Verify checksum and version on the native OS
        env:
          QL_ARCH: ${{ matrix.arch }}
          QL_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $qlFile = Join-Path $PWD "release/qualitylayer-windows-$env:QL_ARCH.exe"
          $qlExpected = ((Get-Content "$qlFile.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $qlFile -Algorithm SHA256).Hash -ne $qlExpected) { throw 'Windows binary checksum mismatch' }
          $qlActual = & $qlFile --version
          if ($LASTEXITCODE -ne 0 -or $qlActual.Trim() -ne $env:QL_VERSION) { throw "Windows version mismatch: $qlActual" }
          $qlHome = Join-Path $env:RUNNER_TEMP ("ql-native-release-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path "$qlHome/.claude", "$qlHome/.codex" -Force | Out-Null
          $env:HOME = $qlHome
          $env:USERPROFILE = $qlHome
          $env:QUALITYLAYER_HOME = Join-Path $qlHome '.qualitylayer'
          $env:QUALITYLAYER_API_BASE = 'http://127.0.0.1:9'
          $env:POLAR_API_BASE = 'http://127.0.0.1:9'
          & $qlFile install --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Windows release install failed' }
          $qlInstalled = Join-Path $qlHome '.qualitylayer/bin/qualitylayer.exe'
          & $qlInstalled --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows release failed to run' }
          & $qlInstalled uninstall --purge --json
          if ($LASTEXITCODE -ne 0 -or (Test-Path "$qlHome/.qualitylayer")) { throw 'Windows release uninstall failed' }

      - name: The published Windows Cockpit draws
        working-directory: qualitylayer
        env:
          QL_ARCH: ${{ matrix.arch }}
        run: bun scripts/check-cockpit.ts "../release/qualitylayer-windows-$env:QL_ARCH.exe" --same-source --require-render

  approve-release:
    name: Approve Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare-release, test, build, windows-release, security-scan, assemble-release, source-ui-gate]
    if: needs.prepare-release.outputs.should_release == 'true'
    # main waits for a reviewer in `production`; a dev prerelease uses `beta`, which has none.
    environment: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    steps:
      - name: Display release details for approval
        run: |
          {
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "## Release Approval Required"
          else
            echo "## Dev prerelease: no approval needed"
          fi
          echo ""
          echo "| Current | → | New |"
          echo "|---------|---|-----|"
          echo "| v${{ needs.prepare-release.outputs.current_version }} | → | **v${{ needs.prepare-release.outputs.version }}** |"
          echo ""
          echo "- Security scan (Trivy) passed"
          echo "- QualityLayer typecheck, lint and tests passed"
          echo "- Six binaries built and checksummed; both Windows releases ran natively"
          echo "- Six App packages built on their own runners, the Mac ones notarized; the asset list guarded"
          echo "- Next: site deployed, workflow texts uploaded and probed, then the release is created"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare-release, build, assemble-release, approve-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
      VERCEL_PROJECT_ID: prj_TXccrJI83HyNvQUZxqStUFgus9NB
    steps:
      # The tested revision, never the branch tip: what is released is what was built.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Vercel names a preview deployment after the branch it finds in git.
          git checkout -B "${{ github.ref_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      # A commit may have landed since the version was decided. The version this job
      # would publish must be the one that was built and approved.
      - name: Check the version again
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/exec
          SR_OUT="${RUNNER_TEMP:?}/sr-output.txt"
          npx semantic-release --dry-run 2>&1 | tee "$SR_OUT" || true
          NEXT=$(grep "next release version" "$SR_OUT" \
            | grep -oP '\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?' | head -1 || true)
          if [ "$NEXT" != "$VERSION" ]; then
            echo "::error::semantic-release would publish '${NEXT}', the build was approved as '${VERSION}'"
            exit 1
          fi

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # Rebuilt from source at this commit; it must be the texts the build job hashed.
      - name: Rebuild the workflow texts
        working-directory: qualitylayer
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.bundle_digest }}
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::the workflow texts differ from the build's: $digest, expected $EXPECTED_DIGEST"
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BUNDLE=${RUNNER_TEMP:?}/workflow-bundle.json" >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      # The schema of the environment being released to goes first: the new handlers need its
      # tables, and a failed migration stops the release before anything is deployed.
      - name: Apply the database schema
        working-directory: docs/site
        run: |
          pull="${RUNNER_TEMP:?}/database.env"
          if [ "$GITHUB_REF_NAME" = main ]; then
            vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          else
            vercel env pull "$pull" --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN" --yes
          fi
          DATABASE_URL="$(sed -n 's/^DATABASE_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$pull")"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL is not set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          node scripts/db-migrate.ts

      # main serves production; dev is a Preview of the same project, named by its branch.
      - name: Deploy the site at this commit
        id: deploy
        run: |
          umask 077
          receipt="${RUNNER_TEMP:?}/website-deployment.json"
          runtime="${RUNNER_TEMP:?}/website-runtime.json"
          verifier=docs/site/scripts/verify-deployment-runtime.mjs
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          if [ "$GITHUB_REF_NAME" = main ]; then
            target=production
            vercel deploy --token="$VERCEL_TOKEN" --prod --json --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" > "$receipt"
          else
            target=preview
            vercel deploy --token="$VERCEL_TOKEN" --target preview --json --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" > "$receipt"
          fi
          deployment_id=$(node "$verifier" receipt-id --deployment "$receipt")
          vercel api "/v13/deployments/$deployment_id" --method GET --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --raw > "$runtime"
          DEPLOY_URL=$(node "$verifier" verify --deployment "$receipt" --metadata "$runtime" --project "$VERCEL_PROJECT_ID" --target "$target" --git-ref "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA")
          bash docs/site/scripts/check-deploy.sh "$DEPLOY_URL"
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      # The domain moves only to a deployment of the branch's tip: a newer commit that
      # landed meanwhile keeps it.
      - name: Point qualitylayer.dev at the beta
        if: github.ref_name == 'dev'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          git fetch --quiet origin dev
          if [ "$(git rev-parse origin/dev)" != "$GITHUB_SHA" ]; then
            echo "::warning::dev moved past $GITHUB_SHA; qualitylayer.dev stays on the newer deployment"
            exit 0
          fi
          for domain in qualitylayer.dev www.qualitylayer.dev; do
            vercel alias set "$DEPLOY_URL" "$domain" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          done

      - name: Upload the workflow texts and read them back
        working-directory: docs/site
        run: |
          # The database of the environment being released to, never the other one.
          pull="${RUNNER_TEMP:?}/database.env"
          if [ "$GITHUB_REF_NAME" = main ]; then
            vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          else
            vercel env pull "$pull" --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN" --yes
          fi
          DATABASE_URL="$(sed -n 's/^DATABASE_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$pull")"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL is not set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          node scripts/upload-workflow.ts upload "$VERSION" "$BUNDLE" "$DIGEST"

      - name: A fresh trial gets the texts from the deployment
        working-directory: docs/site
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/upload-workflow.ts probe "$VERSION" "$DEPLOY_URL"

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release-complete
          path: release

      # One list of every file's hash, signed: install.sh, install.ps1 and `qualitylayer update`
      # check SHA256SUMS.sig against the key built into them before they trust a hash. The key is
      # used here only, after the approval, and never on a runner that builds.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNER: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOvc89TsfxkzK1lxTNLr/FHwImLq1oUWYmmXQ1iYL2oU
        run: |
          set -euo pipefail
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY is not set"; exit 1; }
          key="${RUNNER_TEMP:?}/release-signing-key"
          allowed="${RUNNER_TEMP:?}/release-allowed-signers"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          files="$(cd release && find . -maxdepth 1 -type f ! -name latest.json ! -name '*.sha256' ! -name '*.sig' | sed 's|^\./||' | LC_ALL=C sort)"
          (cd release && printf '%s\n' "$files" | xargs sha256sum > SHA256SUMS)
          sums=release/SHA256SUMS
          signature=release/SHA256SUMS.sig
          ssh-keygen -Y sign -f "$key" -n qualitylayer-release "$sums"
          rm -f "${key:?}"
          # What was signed verifies against the published key, exactly as an installer will check it.
          printf 'release@qualitylayer.dev namespaces="qualitylayer-release" %s\n' "$RELEASE_SIGNER" > "$allowed"
          ssh-keygen -Y verify -f "$allowed" -I release@qualitylayer.dev -n qualitylayer-release -s "$signature" < "$sums"
          (cd release && sha256sum -c SHA256SUMS)

      # The GitHub release says what the updater's manifest says: one section of CHANGELOG.md.
      - name: The release notes, from the manifest
        run: |
          if ! jq -ej '.notes | select(length > 0)' release/latest.json > "${RUNNER_TEMP:?}/release-notes.md"; then
            echo "::error::latest.json carries no release notes"
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=${RUNNER_TEMP:?}/release-notes.md" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/qualitylayer-darwin-arm64
            release/qualitylayer-darwin-x64
            release/qualitylayer-linux-arm64
            release/qualitylayer-linux-x64
            release/qualitylayer-windows-x64.exe
            release/qualitylayer-windows-arm64.exe
            release/install.sh
            release/install.ps1
            release/QualityLayer-*.dmg
            release/QualityLayer-*.app.tar.gz
            release/QualityLayer-*-setup.exe
            release/QualityLayer-*.AppImage

      - name: Create release with semantic-release
        id: semantic-release
        if: github.event_name != 'workflow_dispatch'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The assets below belong to the tag that was built and approved, or to none.
      - name: The release is the one that was built
        if: github.event_name != 'workflow_dispatch'
        env:
          CREATED: ${{ steps.semantic-release.outputs.new_release_version }}
        run: |
          if [ "$CREATED" != "$VERSION" ]; then
            echo "::error::semantic-release created '${CREATED}', expected '${VERSION}'"
            exit 1
          fi

      - name: Create release for manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RELEASE_NOTES_FILE" \
              --target "${{ github.sha }}" $PRE
          fi

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ((i = 1; i <= 12; i++)); do
            gh release view "v${VERSION}" >/dev/null 2>&1 && break
            [ "$i" -eq 12 ] && { echo "Release v${VERSION} was not created"; exit 1; }
            sleep 5
          done
          # Whoever created the release, its body is the changelog's section.
          gh release edit "v${VERSION}" --notes-file "$RELEASE_NOTES_FILE"
          # Everything the manifest names goes up first.
          find release -type f ! -name latest.json -print0 | xargs -0 gh release upload "v${VERSION}" --clobber

      # The updater reads latest.json through qualitylayer.dev, which skips a release that has
      # none: it appears only once every package and signature it names can be downloaded.
      - name: Upload latest.json last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" release/latest.json --clobber
          # The published list must match the guarded one exactly.
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | sort > published.txt
          find release -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt published.txt

  # A clean Linux install of the beta just published, from qualitylayer.dev.
  beta-install:
    name: Beta install
    needs: [prepare-release, publish-release]
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/beta-install.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
