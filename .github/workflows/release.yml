---
name: Release

# Pushes stage private candidates. Publication is an explicit promotion of the same
# successful run and immutable artifacts after Root installed that exact candidate.
# The reusable graph owns compilation, packaging, catalog signing and native proof.
# Promotion never rebuilds or resigns the bytes the person installed.

"on":
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Unpublished stage version or exact candidate version to promote"
        required: false
        type: string

      operation:
        description: Stage privately or promote an installed candidate
        type: choice
        options: [stage, promote]
        default: stage
      candidate_run_id:
        description: Successful candidate workflow run ID (promotion only)
        type: string
      candidate_run_attempt:
        description: Exact successful attempt (promotion only)
        type: string
      candidate_source_sha:
        description: Candidate source SHA; must be this dispatch SHA
        type: string
      installed_receipt:
        description: Root's actual installed-release-candidate JSON receipt
        type: string

jobs:
  check-trigger:
    name: Check Release Trigger
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check commit messages
        id: check
        run: |
          case "$GITHUB_REF_NAME" in
            main | dev) ;;
            *) echo "::error::Only main and dev release, not $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger - proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every commit since the last release tag, not only the tip: a merge
          # commit on top must not hide a fix:/feat:/perf: underneath it. A perf:
          # change is one users feel, so it ships like a fix.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMIT_MSGS=$(git log "$RANGE" --pretty=%B)
          if echo "$COMMIT_MSGS" | grep -qE "(^|\* )(fix|feat|perf)(\([^)]*\))?!?:"; then
            echo "Release commit found in $RANGE"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No release trigger commit in $RANGE - skipping"
          echo "should_run=false" >> "$GITHUB_OUTPUT"

  source-ui-gate:
    # Reuse the standalone UI check on this SHA (qualitylayer-ui.yml: parallel shards, then the one
    # "Source UI browser checks" result); never start a second browser suite here.
    name: Source UI Gate
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const expected = 'Source UI browser checks';
            // The sharded browser suite takes about seven minutes; each shard stops at 15.
            const deadline = Date.now() + 20 * 60 * 1000;
            let latest = null;
            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: context.sha, filter: 'all', per_page: 100
              });
              latest = runs.filter(r => r.name === expected &&
                r.head_sha === context.sha && r.app?.slug === 'github-actions')
                .sort((a, b) => b.id - a.id)[0] ?? null;
              if (latest?.status === 'completed') {
                if (latest.conclusion === 'success') {
                  core.info(`${expected} succeeded for ${context.sha} (check ${latest.id}).`);
                  return;
                }
                core.setFailed(`${expected} concluded ${latest.conclusion} for ${context.sha}; release blocked.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30_000));
            }
            core.setFailed(`${expected} did not succeed within 20m for ${context.sha}; ` +
              `last status ${latest?.status ?? 'missing'}. Release blocked.`);

  supply-chain-gate:
    # Cross-workflow `needs:` does not link supply-chain.yml to this workflow;
    # poll the Checks API for its result on the release SHA instead.
    name: Supply-Chain Gate
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const deadline = Date.now() + 12 * 60 * 1000;
            let last = null;
            while (Date.now() < deadline) {
              // Every page: a release commit carries more check runs than one page holds.
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: context.sha, filter: 'all', per_page: 100
              });
              const sc = runs.filter(r => r.name === 'supply-chain' && r.head_sha === context.sha)
                .sort((a, b) => b.id - a.id)[0];
              last = sc;
              if (sc && sc.status === 'completed') {
                if (sc.conclusion === 'success') return;
                core.setFailed(
                  `supply-chain check concluded ${sc.conclusion} for ${context.sha}; release blocked.`
                );
                return;
              }
              await sleep(20000);
            }
            core.setFailed(
              `supply-chain check did not complete within 12m for ${context.sha} ` +
              `(last status: ${last?.status ?? 'missing'}); release blocked.`
            );

  security-scan:
    name: Security Scan (Trivy)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          # Pinned: this action release defaults to a Trivy version whose release was removed.
          version: "v0.72.0"
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          # With format: sarif the severity filter is dropped unless this is true.
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: "node_modules,qualitylayer/node_modules,docs/site/api,docs/site/node_modules,docs/docusaurus/node_modules"
          trivyignores: ".trivyignore"
          format: "sarif"
          output: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Trivy SARIF to code-scanning (best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: trivy-results.sarif

  # The tests of the release SHA are the ones CI ran on its push (qualitylayer-ci.yml): every job
  # there ends within ten minutes, so this waits up to twenty for all of them (jobs queue behind
  # the account's 20 concurrent jobs) and reuses their result. Only when they are still missing
  # then does the suite run here, split over parallel jobs (test-fallback). The Windows nightly
  # (qualitylayer-windows-nightly.yml) is not a required check.
  ci-reuse:
    name: Reuse CI results
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - name: Decide whether to reuse CI or run checks
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks="${RUNNER_TEMP:?}/ci-checks.json"
          required="${RUNNER_TEMP:?}/required-ci-checks.txt"
          wait=1200
          printf '%s\n' 'Plaintext guard' 'Site API and pages' > "$required"
          printf '%s\n' 'Release smoke (ubuntu-latest)' 'Release smoke (macos-14)' >> "$required"
          for os in ubuntu-latest macos-14; do
            printf 'No text overflows a control (%s)\n' "$os" >> "$required"
          done
          for shard in 1 2 3 4 5 6; do
            printf 'Native Windows runtime (windows-2025, shard %s/6)\n' "$shard" >> "$required"
          done
          started=$(date +%s)
          while true; do
            remaining=$((wait - $(date +%s) + started))
            if [ "$remaining" -le 0 ]; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "Required CI checks still pending or missing after twenty minutes; run checks"
              exit 0
            fi
            if ! timeout "${remaining}s" gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$checks"; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "CI results unavailable; run checks"
              exit 0
            fi
            if ! state=$(jq -r --arg sha "$GITHUB_SHA" --rawfile required "$required" '
              [.[].check_runs[] | select(.head_sha == $sha and .app.slug == "github-actions")]
              | group_by(.name) | map(max_by(.id)) as $latest
              | ($required | split("\n") | map(select(length > 0))) as $wanted
              | if any($latest[]; . as $run | ($wanted | index($run.name)) != null and $run.status == "completed" and $run.conclusion != "success") then "failed"
                elif all($wanted[]; . as $name | any($latest[]; .name == $name and .status == "completed" and .conclusion == "success")) then "success"
                else "pending" end
            ' "$checks"); then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "CI results could not be read; run checks"
              exit 0
            fi
            case "$state" in
              success)
                echo "reuse=true" >> "$GITHUB_OUTPUT"
                echo "Reuse CI: every required check passed for $GITHUB_SHA"
                exit 0
                ;;
              failed)
                echo "::error::A latest required CI check failed for $GITHUB_SHA; refusing a full-suite fallback"
                exit 1
                ;;
              pending)
                remaining=$((wait - $(date +%s) + started))
                if [ "$remaining" -gt 0 ]; then
                  pause=30
                  if [ "$remaining" -lt "$pause" ]; then pause="$remaining"; fi
                  sleep "$pause"
                fi
                ;;
              *) echo "::error::Unknown CI decision state"; exit 1 ;;
            esac
          done

  # The same suite as CI's Linux jobs, in four parallel shards; only when CI cannot be reused.
  test-fallback:
    name: QualityLayer Tests (fallback, shard ${{ matrix.shard }}/4)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-reuse
    if: needs.ci-reuse.outputs.reuse == 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Check the encrypted paths are encrypted in the public tree
        run: bash .github/scripts/check_qualitylayer_encrypted.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      # The suites run the site's real handlers on the in-process database (PGlite) it ships.
      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Install the pinned native Claude Code for mod tests
        run: bash .github/workflows/scripts/setup-claude-code.sh "${RUNNER_TEMP:?}/ql-native-claude"

      - name: Typecheck, lint, test
        working-directory: qualitylayer
        env:
          QUALITYLAYER_REQUIRE_RENDER: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          bun run typecheck
          bun run lint
          bun run test:smoke --shard "$SHARD/4"

      - name: No text overflows a control
        if: matrix.shard == 1
        working-directory: qualitylayer
        run: |
          bun scripts/check-overflow.ts --self-test --require-render
          bun run check:overflow -- --require-render

  # What Approve Release waits for: CI's results reused, or every fallback shard green.
  test:
    name: QualityLayer Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-trigger, ci-reuse, test-fallback]
    if: always() && needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: CI reused or the fallback passed
        env:
          DECIDED: ${{ needs.ci-reuse.result }}
          REUSE: ${{ needs.ci-reuse.outputs.reuse }}
          FALLBACK: ${{ needs.test-fallback.result }}
        run: |
          if [ "$DECIDED" != success ]; then
            echo "::error::the CI reuse decision concluded $DECIDED"
            exit 1
          fi
          if [ "$REUSE" = true ]; then
            echo "Reused CI: every required check passed for $GITHUB_SHA"
          elif [ "$FALLBACK" = success ]; then
            echo "Every fallback shard passed for $GITHUB_SHA"
          else
            echo "::error::the fallback suite concluded $FALLBACK"
            exit 1
          fi

  prepare-release:
    name: Select the version without changing source or tags
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - run: bash .github/workflows/scripts/install-git-crypt.sh
      - env: { GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}" }
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with: { bun-version: "1.4.2" }
      - name: Select an unpublished stage or exact promotion version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation || 'stage' }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = promote ]; then
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]
            [ "$CANDIDATE_SOURCE" = "$GITHUB_SHA" ]
            [[ "$INPUT_VERSION" =~ ^12\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
            printf 'should_release=true\nversion=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            [ "$OPERATION" = stage ]
            selected=$(bun qualitylayer/scripts/release-candidate.ts version)
            printf 'should_release=%s\nversion=%s\n' "$(jq -r .stage <<< "$selected")" "$(jq -r .version <<< "$selected")" >> "$GITHUB_OUTPUT"
            jq -r .reason <<< "$selected"
          fi
      - name: The release has notes in CHANGELOG.md
        if: steps.check.outputs.should_release == 'true'
        env: { VERSION: "${{ steps.check.outputs.version }}" }
        run: bash .github/scripts/changelog-section.sh "$VERSION" > /dev/null

  candidate:
    name: Stage the exact candidate without publication
    permissions:
      contents: read
    needs: prepare-release
    if: >-
      ${{ always() && inputs.operation != 'promote' &&
      needs.prepare-release.outputs.should_release == 'true' &&
      needs.prepare-release.result == 'success' }}
    uses: ./.github/workflows/qualitylayer-candidate.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      authorization_environment: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    secrets: inherit

  verify-candidate:
    name: Verify the successful candidate and Root's installed bytes
    permissions: { contents: read, actions: read }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release, test, security-scan, source-ui-gate]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' &&
      needs.prepare-release.outputs.should_release == 'true' &&
      needs.prepare-release.result == 'success' && needs.test.result == 'success' &&
      needs.security-scan.result == 'success' && needs.source-ui-gate.result == 'success' }}
    outputs:
      assets_id: ${{ steps.identity.outputs.assets_id }}
      catalog_id: ${{ steps.identity.outputs.catalog_id }}
      bundle_digest: ${{ steps.identity.outputs.bundle_digest }}
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          {
            ref: "${{ github.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - run: bash .github/workflows/scripts/install-git-crypt.sh
      - env: { GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}" }
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with: { bun-version: "1.4.2" }
      - name: Read the bounded exact run and artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          INSTALLED_RECEIPT: ${{ inputs.installed_receipt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [ "${#INSTALLED_RECEIPT}" -le 16384 ]
          umask 077
          printf '%s\n' "$INSTALLED_RECEIPT" > "$RUNNER_TEMP/installed.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT" > "$RUNNER_TEMP/candidate-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts?per_page=100" | jq '{artifacts:[.[].artifacts[]]}' > "$RUNNER_TEMP/candidate-artifacts.json"
      - name: Download only the candidate's recorded manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-candidate-manifest-${{ inputs.candidate_run_attempt }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Validate the exact successful run before downloading executables
        id: identity
        env: { VERSION: "${{ needs.prepare-release.outputs.version }}" }
        run: |
          set -euo pipefail
          bun qualitylayer/scripts/release-candidate.ts identity --candidate candidate/candidate.json --installed "$RUNNER_TEMP/installed.json" --run "$RUNNER_TEMP/candidate-run.json" --artifacts "$RUNNER_TEMP/candidate-artifacts.json" --branch "$GITHUB_REF_NAME" > "$RUNNER_TEMP/validated-candidate.json"
          jq -e --arg source "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" --arg version "$VERSION" '.sourceCommit==$source and .sourceTree==$tree and .version==$version' "$RUNNER_TEMP/validated-candidate.json"
          jq -r '"assets_id=\(.assetsArtifact.id)\ncatalog_id=\(.catalogArtifact.id)\nbundle_digest=\(.bundleDigest)"' "$RUNNER_TEMP/validated-candidate.json" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum candidate/candidate.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.identity.outputs.assets_id }},${{ steps.identity.outputs.catalog_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release
      - name: Verify all exact files and the existing production signature
        run: bun qualitylayer/scripts/release-candidate.ts promote --candidate candidate/candidate.json --installed "$RUNNER_TEMP/installed.json" --run "$RUNNER_TEMP/candidate-run.json" --artifacts "$RUNNER_TEMP/candidate-artifacts.json" --branch "$GITHUB_REF_NAME" --release-dir release

  approve-release:
    name: Authorize promotion of the installed candidate
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      [prepare-release, test, security-scan, source-ui-gate, verify-candidate]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' &&
      needs.prepare-release.result == 'success' && needs.test.result == 'success' &&
      needs.security-scan.result == 'success' && needs.source-ui-gate.result == 'success' &&
      needs.verify-candidate.result == 'success' }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    steps:
      - name: Record the exact installed candidate authorized for publication
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ATTEMPT: ${{ inputs.candidate_run_attempt }}
          MANIFEST: ${{ needs.verify-candidate.outputs.manifest_sha256 }}
        run: |
          # shellcheck disable=SC2016
          printf '## Promote v%s\n\nCandidate run %s, attempt %s; source `%s`; manifest `%s`.\n\nRoot installed this exact App/CLI/engine. Source UI, supply-chain, security, tests and five native distribution receipts passed. Publication reuses these bytes without rebuilding or resigning.\n' "$VERSION" "$RUN_ID" "$ATTEMPT" "$GITHUB_SHA" "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish Release
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare-release, verify-candidate, approve-release]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' &&
      needs.prepare-release.result == 'success' && needs.verify-candidate.result == 'success' &&
      needs.approve-release.result == 'success' }}
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
      # qualitylayer-site; the project that serves pilot-shell.com is never deployed to from here.
      VERCEL_PROJECT_ID: prj_SbOGJL2YBjvq9P5MSjxcrj87IGbi
      # Stable promotion is main/Production even while the beta site's variable still names dev.
      PRODUCTION_BRANCH: ${{ !contains(needs.prepare-release.outputs.version, '-') && 'main' || vars.SITE_PRODUCTION_BRANCH || 'main' }}
    steps:
      # The tested revision, never the branch tip: what is released is what was built.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Vercel names a preview deployment after the branch it finds in git.
          git checkout -B "${{ github.ref_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.20.0"

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      - name: Download the same immutable assets, never rebuild them
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify-candidate.outputs.assets_id }},${{ needs.verify-candidate.outputs.catalog_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-candidate-manifest-${{ inputs.candidate_run_attempt }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact candidate bytes before any publication side effect
        env:
          {
            MANIFEST_SHA256: "${{ needs.verify-candidate.outputs.manifest_sha256 }}",
          }
        run: |
          set -euo pipefail
          printf '%s  candidate/candidate.json\n' "$MANIFEST_SHA256" | sha256sum -c -
          bun qualitylayer/scripts/release-candidate.ts verify-files --candidate candidate/candidate.json --release-dir release

      # Rebuilt from source at this commit; it must be the texts the build job hashed.
      - name: Rebuild the workflow texts
        working-directory: qualitylayer
        env:
          EXPECTED_DIGEST: ${{ needs.verify-candidate.outputs.bundle_digest }}
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::the workflow texts differ from the build's: $digest, expected $EXPECTED_DIGEST"
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BUNDLE=${RUNNER_TEMP:?}/workflow-bundle.json" >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Prepare the stable schema-9 deployment source
        if: ${{ !contains(env.VERSION, '-') }}
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
          base=824d98db82ad92e3c172c6e577f22b461df4442b
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --quiet --no-tags --depth=1 origin "$base"
          source="$(mktemp -d "${RUNNER_TEMP:?}/ql-stable-source.XXXXXX")"
          prepared="${source}-backend"
          echo "DEPLOY_SOURCE=$source" >> "$GITHUB_ENV"
          echo "PREPARED_BACKEND=$prepared" >> "$GITHUB_ENV"
          common="$(git rev-parse --path-format=absolute --git-common-dir)"
          [ -f "$common/git-crypt/keys/default" ] || { echo "::error::git-crypt key is unavailable"; exit 1; }
          git clone --quiet --no-checkout --shared "$GITHUB_WORKSPACE" "$source"
          git -C "$source" remote set-url origin "$(git remote get-url origin)"
          for setting in filter.git-crypt.clean filter.git-crypt.smudge filter.git-crypt.required diff.git-crypt.textconv; do
            git -C "$source" config "$setting" "$(git config --get "$setting")"
          done
          mkdir -p "$source/.git/git-crypt/keys"
          cp "$common/git-crypt/keys/default" "$source/.git/git-crypt/keys/default"
          git -C "$source" checkout --quiet -B main "$GITHUB_SHA"
          [ "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA" ]
          ln -s "$GITHUB_WORKSPACE/docs/site/node_modules" "$source/docs/site/node_modules"
          preparer="$source/docs/site/scripts/prepare-beta-backend.mjs"
          node "$preparer" prepare --repo "$source" --frontend "$GITHUB_SHA" --out "$prepared" >/dev/null
          node "$preparer" verify --prepared "$prepared" --frontend "$GITHUB_SHA"
          mv "$source/docs/site/api" "$prepared/unused-current-api"
          cp -R "$prepared/api" "$source/docs/site/api"
          cp "$prepared/source-lineage.json" "$source/source-lineage.json"
          cp "$prepared/deployment-script-provenance.json" "$source/deployment-script-provenance.json"
          node "$preparer" verify --prepared "$prepared" --frontend "$GITHUB_SHA" --api "$source/docs/site/api"
          # The protected schema is pinned by verify; check its version before any database access.
          node -e 'const fs=require("node:fs");const sql=fs.readFileSync(process.argv[1],"utf8");const ns=[...sql.matchAll(/^-- migration (\d+)[ \t]*$/gm)].map(m=>Number(m[1]));if(JSON.stringify(ns)!==JSON.stringify([1,2,3,4,5,6,7,8,9]))throw Error("Stable deployment requires exactly the genuine schema-9 migrations");' "$source/docs/site/api/_lib/schema.sql"

      - name: Test the prepared stable schema-9 API
        if: ${{ !contains(env.VERSION, '-') }}
        working-directory: ${{ env.DEPLOY_SOURCE }}/docs/site
        run: |
          npx vitest run --maxWorkers=2 --dir api
          npx vitest run --maxWorkers=2 scripts/db-beta9.test.ts

      # The schema of the environment being released to goes first: the new handlers need its
      # tables, and a failed migration stops the release before anything is deployed.
      - name: Apply the database schema
        if: ${{ !contains(env.VERSION, '-') }}
        working-directory: ${{ env.DEPLOY_SOURCE }}/docs/site
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
          node scripts/prepare-beta-backend.mjs verify --prepared "${PREPARED_BACKEND:?}" --frontend "$GITHUB_SHA" --api "${DEPLOY_SOURCE:?}/docs/site/api"
          pull="${RUNNER_TEMP:?}/database.env"
          trap 'rm -f "$pull"' EXIT
          vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          # Migrations run as the database owner; the routes may use a narrower role.
          value() { sed -n "s/^$1=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}\$/\\1/p" "$pull"; }
          DATABASE_URL="$(value OWNER_DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || DATABASE_URL="$(value DATABASE_URL)"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::no database is set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export MIGRATION_DATABASE_URL="$DATABASE_URL"
          node scripts/db-migrate.ts
          node scripts/db-beta9.ts

      # Stable main uses the same pinned schema-9 service as the live beta, on Production.
      - name: Deploy the site at this commit
        if: ${{ !contains(env.VERSION, '-') }}
        id: deploy
        run: |
          umask 077
          [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
          receipt="${RUNNER_TEMP:?}/website-deployment.json"
          runtime="${RUNNER_TEMP:?}/website-runtime.json"
          source="${DEPLOY_SOURCE:?}"
          prepared="${PREPARED_BACKEND:?}"
          verifier="$source/docs/site/scripts/verify-deployment-runtime.mjs"
          preparer="$source/docs/site/scripts/prepare-beta-backend.mjs"
          node "$preparer" verify --prepared "$prepared" --frontend "$GITHUB_SHA" --api "$source/docs/site/api"
          backend_base=824d98db82ad92e3c172c6e577f22b461df4442b
          backend_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).overlayDigest)' "$prepared/receipt.json")"
          target=production
          (cd "$source" && vercel deploy --token="$VERCEL_TOKEN" --prod --skip-domain --json --build-env QUALITYLAYER_BACKEND_PROFILE=legacy9 --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" --meta "backendBaseSha=$backend_base" --meta "backendOverlayDigest=$backend_digest") > "$receipt"
          deployment_id=$(node "$verifier" receipt-id --deployment "$receipt")
          vercel api "/v13/deployments/$deployment_id" --method GET --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --raw > "$runtime"
          DEPLOY_URL=$(node "$verifier" verify --deployment "$receipt" --metadata "$runtime" --project "$VERCEL_PROJECT_ID" --target "$target" --git-ref "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA")
          node "$preparer" verify-runtime --prepared "$prepared" --frontend "$GITHUB_SHA" --api "$source/docs/site/api" --metadata "$runtime"
          bash "$source/docs/site/scripts/check-deploy.sh" "$DEPLOY_URL" --pending-release "$VERSION"
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Upload the workflow texts and read them back
        working-directory: docs/site
        run: |
          set -euo pipefail
          umask 077
          if [[ "$VERSION" != *-* ]]; then
            [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
            cd "${DEPLOY_SOURCE:?}/docs/site"
            node scripts/prepare-beta-backend.mjs verify --prepared "${PREPARED_BACKEND:?}" --frontend "$GITHUB_SHA" --api "${DEPLOY_SOURCE:?}/docs/site/api"
          fi
          # Released stable and beta Apps both use normal Production accounts.
          # This writes only their signed, versioned workflow bundle; beta API code stays in Preview.
          pull="${RUNNER_TEMP:?}/database.env"
          trap 'rm -f "$pull"' EXIT
          vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          value() { sed -n "s/^$1=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}\$/\\1/p" "$pull"; }
          DATABASE_URL="$(value OWNER_DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || DATABASE_URL="$(value DATABASE_URL)"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::no database is set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          node scripts/upload-workflow.ts upload "$VERSION" "$BUNDLE" "$DIGEST"

      - name: A fresh trial gets the texts from the deployment
        working-directory: docs/site
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url || 'https://qualitylayer.dev' }}
        run: |
          if [[ "$VERSION" != *-* ]]; then cd "${DEPLOY_SOURCE:?}/docs/site"; fi
          node scripts/upload-workflow.ts probe "$VERSION" "$DEPLOY_URL"

      # The GitHub release says what the updater's manifest says: one section of CHANGELOG.md.
      - name: The release notes, from the manifest
        run: |
          if ! jq -ej '.notes | select(length > 0)' release/latest.json > "${RUNNER_TEMP:?}/release-notes.md"; then
            echo "::error::latest.json carries no release notes"
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=${RUNNER_TEMP:?}/release-notes.md" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/qualitylayer-darwin-arm64
            release/qualitylayer-darwin-x64
            release/qualitylayer-linux-arm64
            release/qualitylayer-linux-x64
            release/qualitylayer-windows-x64.exe
            release/install.sh
            release/install.ps1
            release/QualityLayer-*.dmg
            release/QualityLayer-*.app.tar.gz
            release/QualityLayer-*-setup.exe
            release/QualityLayer-*.AppImage

      - name: Create only the exact promoted candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          MANIFEST_SHA256: ${{ needs.verify-candidate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          marker="<!-- qualitylayer-candidate:$CANDIDATE_RUN:$CANDIDATE_ATTEMPT:$MANIFEST_SHA256 -->"
          printf '\n%s\n' "$marker" >> "$RELEASE_NOTES_FILE"
          release_flags=(--draft --latest=false)
          case "$VERSION" in *-*) release_flags+=(--prerelease) ;; esac
          if gh release view "v$VERSION" --json body > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e --arg marker "$marker" '.body | contains($marker)' "$RUNNER_TEMP/existing-release.json"
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              git fetch --quiet origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
              [ "$(git rev-parse "v$VERSION^{commit}")" = "$GITHUB_SHA" ]
            else
              gh release view "v$VERSION" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha'
            fi
          else
            # A preexisting tag for other bytes is never moved or overwritten.
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              git fetch --quiet origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
              [ "$(git rev-parse "v$VERSION^{commit}")" = "$GITHUB_SHA" ]
            fi
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RELEASE_NOTES_FILE" --target "$GITHUB_SHA" "${release_flags[@]}"
          fi

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ((i = 1; i <= 12; i++)); do
            gh release view "v${VERSION}" >/dev/null 2>&1 && break
            [ "$i" -eq 12 ] && { echo "Release v${VERSION} was not created"; exit 1; }
            sleep 5
          done
          # Whoever created the release, its body is the changelog's section.
          gh release edit "v${VERSION}" --notes-file "$RELEASE_NOTES_FILE"
          # Everything the manifest names goes up first.
          find release -type f ! -name latest.json -print0 | xargs -0 gh release upload "v${VERSION}" --clobber

      # The updater reads latest.json through qualitylayer.dev, which skips a release that has
      # none: it appears only once every package and signature it names can be downloaded.
      - name: Upload latest.json last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" release/latest.json --clobber
          # The published list must match the guarded one exactly.
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | sort > published.txt
          find release -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt published.txt

      - name: Publish only the complete candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "v$VERSION" --draft=false --prerelease=false --latest
            [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$VERSION" ]
          fi

      # The domains move only to a Production deployment of the branch's tip: a newer commit
      # that landed meanwhile keeps them.
      - name: Point qualitylayer.dev at this release
        if: ${{ !contains(env.VERSION, '-') && github.ref_name == 'main' }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          bash "${DEPLOY_SOURCE:?}/docs/site/scripts/check-deploy.sh" "$DEPLOY_URL"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_REF_NAME moved past $GITHUB_SHA; qualitylayer.dev stays on the newer deployment"
            exit 0
          fi
          vercel promote "$DEPLOY_URL" --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Remove private stable deployment sources
        if: always()
        run: |
          for path in "${DEPLOY_SOURCE:-}" "${PREPARED_BACKEND:-}"; do
            case "$path" in
              "${RUNNER_TEMP:?}"/ql-stable-source.*) rm -rf -- "$path" ;;
              "") ;;
              *) echo "::error::refusing to remove an unexpected stable deployment path"; exit 1 ;;
            esac
          done

  # A clean Linux install of the beta just published, from qualitylayer.dev.
  beta-install:
    name: Beta install
    permissions:
      contents: read
    needs: [prepare-release, publish-release]
    if: ${{ always() && github.ref_name == 'dev' && needs.publish-release.result == 'success' }}
    uses: ./.github/workflows/beta-install.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
