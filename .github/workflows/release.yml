---
name: Pilot 11 Maintenance Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared stable 11.x version (e.g., 11.0.10)"
        required: true
        type: string
      source_sha:
        description: "Full reviewed 11.x commit SHA; must equal the dispatch commit"
        required: true
        type: string
      changelog:
        description: "Custom changelog content (optional - overrides generated changelog)"
        required: false
        type: string

jobs:
  # Check if this commit should trigger a release
  check-trigger:
    name: Check Release Trigger
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate prepared maintenance source
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/11.x
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/11.x
          [[ "$RELEASE_VERSION" =~ ^11\.[0-9]+\.[0-9]+$ ]]
          python3 - <<'CHECK_VERSION'
          import json, os, re
          from pathlib import Path
          expected = os.environ["RELEASE_VERSION"]
          for file in ("installer/__init__.py", "launcher/__init__.py"):
              match = re.search(r'^__version__ = "([^"]+)"', Path(file).read_text(), re.M)
              if not match or match[1] != expected:
                  raise SystemExit(f"Prepare {file} before qualification")
          for file in ("console/package.json", "pilot/package.json"):
              if json.loads(Path(file).read_text())["version"] != expected:
                  raise SystemExit(f"Prepare {file} before qualification")
          CHECK_VERSION
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  supply-chain-gate:
    # Cross-workflow `needs:` doesn't link supply-chain.yml to this workflow.
    # Poll the Checks API for the `supply-chain` check on the release SHA and
    # fail unless the exact pinned SHA passed. 11.x push starts supply-chain;
    # manual supply-chain dispatch at the same SHA is also supported.
    name: Supply-Chain Gate
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const deadline = Date.now() + 12 * 60 * 1000;
            let last = null;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                ...context.repo, ref: process.env.SOURCE_SHA
              });
              const sc = data.check_runs.find(r => r.name === 'supply-chain');
              last = sc;
              if (sc && sc.status === 'completed') {
                if (sc.conclusion === 'success') return;
                core.setFailed(
                  `supply-chain check concluded ${sc.conclusion} for ${process.env.SOURCE_SHA}; release blocked.`
                );
                return;
              }
              await sleep(20000);
            }
            core.setFailed(
              `supply-chain check did not complete within 12m for ${process.env.SOURCE_SHA} ` +
              `(last status: ${last?.status ?? 'missing'}); release blocked.`
            );

  security-scan:
    name: Security Scan (Trivy)
    permissions:
      contents: read
      # Best-effort SARIF upload to the code-scanning / Security tab.
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          # Pinned explicitly: this action release defaults to Trivy v0.65.0, whose
          # GitHub release has since been removed, so the installer 404s and the job
          # fails before scanning anything. Keep this at a version that exists.
          version: 'v0.72.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          # With format: sarif, trivy-action unsets the severity filter (scans
          # ALL severities for the report) unless this is true — which makes
          # exit-code fire on MEDIUM/LOW too. Keep the gate scoped to CRITICAL,HIGH.
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: '.venv,node_modules,console/node_modules,launcher,docs/site/api,console,docs/site/node_modules,docs/docusaurus/node_modules'
          trivyignores: '.trivyignore'
          format: 'sarif'
          output: trivy-results.sarif

      # if: always() — Trivy keeps exit-code 1, so without it the SARIF would
      # vanish exactly when a vulnerability is found (Codex medium #4).
      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Trivy SARIF to code-scanning (best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Security scan summary note
        if: always()
        run: echo "### Security Scan — Trivy SARIF uploaded as the 'trivy-sarif' artifact (and the Security tab when code-scanning is enabled)." >> "$GITHUB_STEP_SUMMARY"

  python-tests:
    name: Python Unit Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install . pytest pytest-cov pytest-asyncio hypothesis

      - name: Validate generated agent assets
        run: |
          python3 -m launcher.cli skills validate pilot/skills --platform all
          python3 scripts/validate_agent_assets.py
          python3 scripts/gen_hook_manifests.py --check

      - name: Run unit tests with coverage
        run: |
          python3 -m pytest installer/tests/unit/ launcher/tests/unit/ pilot/hooks/tests/ pilot/skills/benchmark/tests/ -v \
            --cov=installer --cov=launcher --cov=pilot.hooks \
            --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Upload test + coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  website-tests:
    name: Website API and Skill Sync Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh
      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.22.0"
      - name: Run skill sync regression tests
        run: node --test pilot/skills/setup-rules/tests/sync-agent-assets.test.mjs
      - name: Install website dependencies
        working-directory: docs/site
        run: npm ci
      - name: Run website and trial API tests
        working-directory: docs/site
        run: npm test

  console-tests:
    name: Console Unit Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        working-directory: console
        run: bun install --frozen-lockfile

      - name: Run console tests
        working-directory: console
        run: bun test

  console-build:
    name: Console Build & Typecheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "24.22.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        working-directory: console
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: console
        run: bun run typecheck

      - name: Knip (dead code, unused deps & exports)
        working-directory: console
        run: bun run knip

      - name: Build hooks
        working-directory: console
        run: bun run build

      - name: Build viewer
        working-directory: console
        run: bun run build:viewer

      - name: Prepared runtime bundles match the qualified source
        run: git diff --exit-code -- pilot/scripts pilot/ui

  lint:
    name: Lint (ruff + vulture + deadcode + import boundary)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install . ruff vulture deadcode import-linter

      - name: Ruff
        run: ruff check launcher installer pilot/hooks

      - name: Vulture (dead code)
        run: vulture

      - name: Deadcode (unused symbols — launcher + installer)
        run: deadcode launcher installer

      - name: Import boundary (launcher must not import installer, and vice-versa)
        run: lint-imports

  # Validate the prepared maintenance version without changing qualified source
  prepare-release:
    name: Prepare Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, supply-chain-gate]
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      current_version: ${{ steps.check.outputs.current_version }}
      changelog: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Get previous legacy version
        id: current
        run: |
          set -euo pipefail
          CURRENT=$(git tag --merged HEAD --list 'v11.*' --sort=-version:refname | grep -E '^v11\.[0-9]+\.[0-9]+$' | sed -n '1p')
          [[ "$CURRENT" =~ ^v11\.[0-9]+\.[0-9]+$ ]]
          echo "version=${CURRENT#v}" >> "$GITHUB_OUTPUT"

      - name: Validate patch version and unused release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'CHECK_NEWER'
          import os
          parse = lambda value: tuple(map(int, value.split(".")))
          if parse(os.environ["RELEASE_VERSION"]) <= parse(os.environ["PREVIOUS_VERSION"]):
              raise SystemExit("The maintenance version must be newer than the previous 11.x tag")
          CHECK_NEWER
          {
            echo "current_version=$PREVIOUS_VERSION"
            echo "should_release=true"
            echo "version=$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `v${process.env.RELEASE_VERSION}` });
              core.setFailed("That release already exists; inspect it before any retry.");
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Generate changelog with git-cliff
        if: steps.check.outputs.should_release == 'true'
        id: git-cliff
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4
        with:
          config: cliff.toml
          args: v${{ steps.current.outputs.version }}.. --unreleased --tag v${{ steps.check.outputs.version }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  # Build jobs run in parallel after prepare-release
  build-pilot-x86:
    name: Build Pilot Linux x86_64
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Verify version
        run: |
          echo "Building version: ${{ needs.prepare-release.outputs.version }}"
          cat launcher/__init__.py | grep __version__

      - name: Set up uv for isolated artifact smoke
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Build binary
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e BUILD_VERSION=${{ needs.prepare-release.outputs.version }} \
            python:3.12-bullseye \
            bash -c "
              pip install . && \
              python -m launcher.build --release --version \$BUILD_VERSION && \
              ls -la launcher/dist/
            "

      - name: Smoke-test shipped wrapper
        run: |
          python3 scripts/smoke_pilot_artifact.py \
            --wrapper launcher/dist/pilot \
            --module launcher/dist/pilot-linux-x86_64.so \
            --expected-version "${{ needs.prepare-release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-linux-x86_64
          path: |
            launcher/dist/pilot-linux-x86_64.so
            launcher/dist/pilot
          retention-days: 1

  build-pilot-arm64:
    name: Build Pilot Linux arm64
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Verify version
        run: |
          echo "Building version: ${{ needs.prepare-release.outputs.version }}"
          cat launcher/__init__.py | grep __version__

      - name: Set up uv for isolated artifact smoke
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Build binary
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e BUILD_VERSION=${{ needs.prepare-release.outputs.version }} \
            python:3.12-bullseye \
            bash -c "
              pip install . && \
              python -m launcher.build --release --version \$BUILD_VERSION && \
              ls -la launcher/dist/
            "

      - name: Smoke-test shipped wrapper
        run: |
          python3 scripts/smoke_pilot_artifact.py \
            --wrapper launcher/dist/pilot \
            --module launcher/dist/pilot-linux-arm64.so \
            --expected-version "${{ needs.prepare-release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-linux-arm64
          path: launcher/dist/pilot-linux-arm64.so
          retention-days: 1

  build-pilot-darwin-x86:
    name: Build Pilot Darwin x86_64
    permissions:
      contents: read
    runs-on: macos-15-intel
    timeout-minutes: 30
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: brew install git-crypt

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-pyinstaller
          restore-keys: ${{ runner.os }}-pip-

      - name: Verify version
        run: |
          echo "Building version: ${{ needs.prepare-release.outputs.version }}"
          cat launcher/__init__.py | grep __version__

      - name: Set up uv for isolated artifact smoke
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Build binary
        run: |
          pip install .
          python -m launcher.build --release --version ${{ needs.prepare-release.outputs.version }}
          ls -la launcher/dist/

      - name: Verify installer on macOS system Bash
        run: |
          /bin/bash --version | head -1
          /bin/bash -n install.sh
          env PATH="/bin:/usr/bin:/usr/sbin:/sbin:$PATH" PYTHONDONTWRITEBYTECODE=1 \
            uv run --no-project --no-config --with pytest==8.4.2 \
            pytest -p no:cacheprovider -q installer/tests/unit/test_install_sh.py

      - name: Smoke-test shipped wrapper
        run: |
          python3 scripts/smoke_pilot_artifact.py \
            --wrapper launcher/dist/pilot \
            --module launcher/dist/pilot-darwin-x86_64.so \
            --expected-version "${{ needs.prepare-release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-darwin-x86_64
          path: launcher/dist/pilot-darwin-x86_64.so
          retention-days: 1

  build-pilot-darwin-arm64:
    name: Build Pilot Darwin arm64
    permissions:
      contents: read
    runs-on: macos-14
    timeout-minutes: 30
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install git-crypt
        run: brew install git-crypt

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-pyinstaller
          restore-keys: ${{ runner.os }}-pip-

      - name: Verify version
        run: |
          echo "Building version: ${{ needs.prepare-release.outputs.version }}"
          cat launcher/__init__.py | grep __version__

      - name: Set up uv for isolated artifact smoke
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Build binary
        run: |
          pip install .
          python -m launcher.build --release --version ${{ needs.prepare-release.outputs.version }}
          ls -la launcher/dist/

      - name: Verify installer on macOS system Bash
        run: |
          /bin/bash --version | head -1
          /bin/bash -n install.sh
          env PATH="/bin:/usr/bin:/usr/sbin:/sbin:$PATH" PYTHONDONTWRITEBYTECODE=1 \
            uv run --no-project --no-config --with pytest==8.4.2 \
            pytest -p no:cacheprovider -q installer/tests/unit/test_install_sh.py

      - name: Smoke-test shipped wrapper
        run: |
          python3 scripts/smoke_pilot_artifact.py \
            --wrapper launcher/dist/pilot \
            --module launcher/dist/pilot-darwin-arm64.so \
            --expected-version "${{ needs.prepare-release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-darwin-arm64
          path: launcher/dist/pilot-darwin-arm64.so
          retention-days: 1

  # Manual approval gate - displays version and changelog, waits for approval
  approve-release:
    name: Approve Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare-release
      - python-tests
      - website-tests
      - console-tests
      - console-build
      - lint
      - build-pilot-x86
      - build-pilot-arm64
      - build-pilot-darwin-x86
      - build-pilot-darwin-arm64
      - security-scan
    if: needs.prepare-release.outputs.should_release == 'true'
    environment: production
    steps:
      - name: Display release details for approval
        env:
          CHANGELOG_CONTENT: ${{ needs.prepare-release.outputs.changelog }}
        run: |
          {
          cat << SUMMARY
          ## 🚀 Release Approval Required

          ### Version Bump
          | Current | → | New |
          |---------|---|-----|
          | v${{ needs.prepare-release.outputs.current_version }} | → | **v${{ needs.prepare-release.outputs.version }}** |

          ### Build Status
          - ✅ Security scan (Trivy) passed
          - ✅ Python unit tests passed
          - ✅ Website API and skill sync tests passed
          - ✅ Console unit tests passed
          - ✅ Console build & typecheck passed
          - ✅ Linux x86_64 build ready
          - ✅ Linux arm64 build ready
          - ✅ Darwin x86_64 build ready
          - ✅ Darwin arm64 build ready

          ### Changelog for v${{ needs.prepare-release.outputs.version }}

          SUMMARY

          # Write changelog safely via environment variable
          printf '%s\n' "$CHANGELOG_CONTENT"

          cat << 'SUMMARY'

          ---
          **Approve this deployment to publish the release.**
          SUMMARY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release approved
        run: |
          echo "✅ Release v${{ needs.prepare-release.outputs.version }} approved!"
          echo "Proceeding to publish..."

  # Create release and upload all artifacts only after approval
  publish-release:
    name: Publish Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare-release
      - approve-release
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            artifacts/pilot-linux-x86_64/pilot-linux-x86_64.so
            artifacts/pilot-linux-arm64/pilot-linux-arm64.so
            artifacts/pilot-darwin-x86_64/pilot-darwin-x86_64.so
            artifacts/pilot-darwin-arm64/pilot-darwin-arm64.so
            artifacts/pilot-linux-x86_64/pilot

      - name: Create exact legacy tag and non-latest draft
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: draft
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES: ${{ inputs.changelog || needs.prepare-release.outputs.changelog }}
        with:
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`;
            const latest = await github.rest.repos.getLatestRelease(context.repo);
            if (!/^v(?:1[2-9]|[2-9][0-9]+)\./.test(latest.data.tag_name))
              throw new Error("Expected QualityLayer 12+ to remain the latest stable release.");
            core.setOutput("latest_id", String(latest.data.id));
            core.setOutput("latest_tag", latest.data.tag_name);
            // createRef fails if another publisher already reserved this tag. Never overwrite it.
            await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: process.env.SOURCE_SHA });
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: process.env.SOURCE_SHA,
              name: `Pilot Shell ${process.env.RELEASE_VERSION}`, body: process.env.RELEASE_NOTES,
              draft: true, prerelease: false, make_latest: "false", generate_release_notes: false
            });
            core.setOutput("release_id", String(release.data.id));

      - name: Generate tree.json manifest
        run: |
          echo "Generating tree.json from repository files..."
          git ls-tree -r HEAD | python3 -c "
          import sys, json
          items = []
          for line in sys.stdin:
              parts = line.strip().split('\t', 1)
              if len(parts) == 2:
                  meta, path = parts
                  fields = meta.split()
                  if len(fields) == 3:
                      items.append({'path': path, 'type': 'blob', 'sha': fields[2]})
          json.dump({'tree': items}, sys.stdout, separators=(', ', ': '))
          " > tree.json

          echo "Validating tree.json..."
          python3 -c "import json; data=json.load(open('tree.json')); assert 'tree' in data and len(data['tree']) > 0, 'Invalid tree.json'"

          echo "tree.json generated successfully with $(python3 -c "import json; print(len(json.load(open('tree.json'))['tree']))") files"

      - name: Upload exact assets to the legacy draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v$RELEASE_VERSION" \
            artifacts/pilot-linux-x86_64/pilot-linux-x86_64.so \
            artifacts/pilot-linux-arm64/pilot-linux-arm64.so \
            artifacts/pilot-darwin-x86_64/pilot-darwin-x86_64.so \
            artifacts/pilot-darwin-arm64/pilot-darwin-arm64.so \
            artifacts/pilot-linux-x86_64/pilot \
            tree.json

      - name: Publish stable legacy release without changing QualityLayer latest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_LATEST_ID: ${{ steps.draft.outputs.latest_id }}
          EXPECTED_LATEST_TAG: ${{ steps.draft.outputs.latest_tag }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const release = await github.rest.repos.getRelease({ ...context.repo, release_id });
            const expected = ["pilot", "pilot-linux-x86_64.so", "pilot-linux-arm64.so", "pilot-darwin-x86_64.so", "pilot-darwin-arm64.so", "tree.json"];
            const assets = release.data.assets;
            if (release.data.id !== release_id || release.data.tag_name !== `v${process.env.RELEASE_VERSION}` ||
                !release.data.draft || release.data.prerelease ||
                expected.length !== assets.length || expected.some(name => !assets.some(asset => asset.name === name && asset.size > 0)))
              throw new Error("Draft assets or stable-release metadata do not match the qualified set.");
            const fs = require("node:fs"), crypto = require("node:crypto");
            const local = {
              pilot: "artifacts/pilot-linux-x86_64/pilot",
              "pilot-linux-x86_64.so": "artifacts/pilot-linux-x86_64/pilot-linux-x86_64.so",
              "pilot-linux-arm64.so": "artifacts/pilot-linux-arm64/pilot-linux-arm64.so",
              "pilot-darwin-x86_64.so": "artifacts/pilot-darwin-x86_64/pilot-darwin-x86_64.so",
              "pilot-darwin-arm64.so": "artifacts/pilot-darwin-arm64/pilot-darwin-arm64.so",
              "tree.json": "tree.json"
            };
            for (const name of expected) {
              const digest = "sha256:" + crypto.createHash("sha256").update(fs.readFileSync(local[name])).digest("hex");
              if (assets.find(asset => asset.name === name).digest !== digest)
                throw new Error("Uploaded asset bytes differ from the qualified local set.");
            }
            const ref = await github.rest.git.getRef({ ...context.repo, ref: `tags/v${process.env.RELEASE_VERSION}` });
            if (ref.data.object.type !== "commit" || ref.data.object.sha !== process.env.SOURCE_SHA)
              throw new Error("The legacy tag no longer matches the qualified source.");
            const before = await github.rest.repos.getLatestRelease(context.repo);
            if (String(before.data.id) !== process.env.EXPECTED_LATEST_ID || before.data.tag_name !== process.env.EXPECTED_LATEST_TAG)
              throw new Error("QualityLayer latest changed during preparation; inspect before publishing.");
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, prerelease: false, make_latest: "false" });
            const after = await github.rest.repos.getLatestRelease(context.repo);
            if (String(after.data.id) !== process.env.EXPECTED_LATEST_ID || after.data.tag_name !== process.env.EXPECTED_LATEST_TAG)
              throw new Error("Latest changed unexpectedly; inspect it without automatically repointing it.");
            core.notice(`Published Pilot Shell ${process.env.RELEASE_VERSION}; QualityLayer latest remains ${after.data.tag_name}.`);
