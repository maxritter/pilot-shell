name: QualityLayer candidate qualification

on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      authorization_environment: { required: true, type: string }
    secrets:
      GIT_CRYPT_KEY: { required: true }
      APPLE_CERTIFICATE: { required: true }
      APPLE_CERTIFICATE_PASSWORD: { required: true }
      ASC_KEY_ID: { required: true }
      ASC_ISSUER_ID: { required: true }
      ASC_PRIVATE_KEY: { required: true }
      TAURI_SIGNING_PRIVATE_KEY: { required: true }
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: { required: false }
      RELEASE_SIGNING_KEY: { required: true }
      # Windows Authenticode through Azure Artifact Signing: the Entra app
      # qualitylayer-github-signing, reached with this run's OIDC token (no client secret). Optional:
      # without them, or without an active certificate profile, Windows builds unsigned with a warning.
      AZURE_CLIENT_ID: { required: false }
      AZURE_TENANT_ID: { required: false }
      AZURE_SUBSCRIPTION_ID: { required: false }
    outputs:
      bundle_digest:
        value: ${{ jobs.build.outputs.bundle_digest }}
      candidate_manifest_sha256:
        value: ${{ jobs.distribution-readiness.outputs.manifest_sha256 }}

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the private staging request
        env:
          VERSION: ${{ inputs.version }}
          AUTHORIZATION: ${{ inputs.authorization_environment }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = maxritter/qualitylayer ]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERSION" =~ ^12\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          case "$GITHUB_WORKFLOW_REF" in
            maxritter/qualitylayer/.github/workflows/release.yml@refs/heads/main|maxritter/qualitylayer/.github/workflows/release.yml@refs/heads/dev) ;;
            *) echo 'Stage through the guarded Release workflow on main or dev'; exit 1 ;;
          esac
          case "$AUTHORIZATION" in
            beta) ;;
            production) [ "$GITHUB_REF_NAME" = main ] ;;
            *) echo 'Unknown signing authorization environment'; exit 1 ;;
          esac

  memory-payload:
    name: Native memory payload (${{ matrix.target }})
    needs: validate-inputs
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-26, arch: arm64 }
          - { target: darwin-x64, os: macos-15-intel, arch: x64 }
          - { target: linux-x64, os: ubuntu-22.04, arch: x64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, arch: arm64 }
          - { target: win32-x64, os: windows-2025, arch: x64 }
    environment: ${{ inputs.authorization_environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve encrypted bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"
          bun-download-url: ${{ runner.os == 'Windows' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64.zip' || '' }}
      - name: Install git-crypt
        if: runner.os != 'Windows'
        run: bash .github/workflows/scripts/install-git-crypt.sh
      - name: Unlock repository
        if: runner.os != 'Windows'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - name: Unlock repository on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read pinned current and approved previous bytes without rebuilding Go
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          previous=c5d5909fe7e9ed2380cbd98f8ed8661dfe660af0
          [ "$(git rev-parse 'v12.0.0-beta.57^{commit}')" = "$previous" ]
          mkdir -p "$RUNNER_TEMP/engine" "$RUNNER_TEMP/piece/signing/$TARGET" "$RUNNER_TEMP/piece/evidence/$TARGET"
          git cat-file --filters "$previous:qualitylayer/src/memory-engine/payloads/manifest.json" > "$RUNNER_TEMP/previous-manifest.json"
          git cat-file --filters "$previous:qualitylayer/src/memory-engine/payloads/$TARGET.gz" > "$RUNNER_TEMP/previous.gz"
          # JavaScript template expressions must stay unexpanded by the shell.
          # shellcheck disable=SC2016
          bun -e 'import {gunzipSync} from "node:zlib";const p=process.env.RUNNER_TEMP;const t=process.env.TARGET;await Bun.write(`${p}/engine/engram`,gunzipSync(await Bun.file(`qualitylayer/src/memory-engine/payloads/${t}.gz`).bytes(),{maxOutputLength:67108864}));await Bun.write(`${p}/previous-engine`,gunzipSync(await Bun.file(`${p}/previous.gz`).bytes(),{maxOutputLength:67108864}));'
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP:?}/ql-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'
      - name: Sign and notarize the actual Darwin engine before compression
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/engine/engram"
          signed="$RUNNER_TEMP/piece/signing/$TARGET"
          chmod 700 "$raw"
          identity=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$identity" ]
          codesign --force --timestamp --options runtime --identifier dev.qualitylayer.memory --sign "$identity" "$raw"
          codesign --verify --strict --verbose=4 "$raw" 2> "$signed/verify.txt"
          codesign -dv --verbose=4 "$raw" 2> "$signed/signature.txt"
          zip -j -X "$signed/engine.zip" "$raw"
          key="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$ASC_PRIVATE_KEY" > "$key")
          xcrun notarytool submit "$signed/engine.zip" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json > "$signed/notary.json"
          jq -e '.status == "Accepted"' "$signed/notary.json"
      # Without an active certificate profile the engine stays unsigned (windows-unsigned-beta).
      - name: Windows signing
        id: signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-signing
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.AZURE_SIGNING_RESOURCE_GROUP }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}
      # The CLI unpacks this engine as engram.exe and runs it; it is signed like every shipped .exe.
      - name: Sign the actual Windows engine before compression
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $env:RUNNER_TEMP 'engine/engram'
          $signed = Join-Path $env:RUNNER_TEMP "piece/signing/$env:TARGET"
          # signtool and WinVerifyTrust choose the PE format by the file's extension.
          $exe = Join-Path $env:RUNNER_TEMP 'engine/engram.exe'
          Copy-Item -LiteralPath $raw -Destination $exe
          & ./.github/workflows/scripts/windows-sign.ps1 -Path $exe
          & ./.github/workflows/scripts/verify-authenticode.ps1 -Path $exe
          $signtool = ($env:QUALITYLAYER_WINDOWS_SIGN_COMMAND | ConvertFrom-Json).cmd
          & $signtool verify /pa /v $exe *> (Join-Path $signed 'verify.txt')
          if ($LASTEXITCODE -ne 0) { throw 'signtool cannot verify the signed engine' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          [ordered]@{
            status = "$($signature.Status)"
            subject = $signature.SignerCertificate.Subject
            thumbprint = $signature.SignerCertificate.Thumbprint
            timeStamper = $signature.TimeStamperCertificate.Subject
            sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $signed 'authenticode.json') -Encoding utf8
          Move-Item -LiteralPath $exe -Destination $raw -Force
      - name: Record the exact platform signing policy and stage bytes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # JavaScript template expressions must stay unexpanded by the shell.
          # shellcheck disable=SC2016
          bun -e 'import {createHash} from "node:crypto";const t=process.env.TARGET,p=process.env.RUNNER_TEMP,s=`${p}/piece`,d=`signing/${t}`;const hash=b=>createHash("sha256").update(b).digest("hex");const raw=hash(await Bun.file(`${p}/engine/engram`).bytes());const trusted=await Bun.file("qualitylayer/src/memory-engine/payloads/manifest.json").json();const pre=trusted.artifacts[t].sha256;let proof={policy:t.startsWith("darwin-")?"darwin-developer-id":t.startsWith("win32-")?(await Bun.file(`${s}/${d}/authenticode.json`).exists()?"windows-authenticode":"windows-unsigned-beta"):"linux-signed-catalog",rawSha256:raw,preSignSha256:pre,evidence:[]};if(t.startsWith("darwin-")){const sig=await Bun.file(`${s}/${d}/signature.txt`).text();const notary=await Bun.file(`${s}/${d}/notary.json`).json();proof={...proof,identity:/^Authority=(Developer ID Application:.*)$/m.exec(sig)?.[1],teamId:/^TeamIdentifier=(.*)$/m.exec(sig)?.[1],timestamp:/^Timestamp=(.*)$/m.exec(sig)?.[1],notary:{status:notary.status,id:notary.id,containerSha256:hash(await Bun.file(`${s}/${d}/engine.zip`).bytes()),containerPath:`${d}/engine.zip`,entryPath:"engram"}};for(const name of ["signature.txt","verify.txt","notary.json"]){const path=`${d}/${name}`,b=await Bun.file(`${s}/${path}`).bytes();proof.evidence.push({path,sha256:hash(b),bytes:b.length});}}else if(proof.policy==="windows-authenticode"){const auth=await Bun.file(`${s}/${d}/authenticode.json`).json();const verify=await Bun.file(`${s}/${d}/verify.txt`).text();proof={...proof,identity:auth.subject,thumbprint:auth.thumbprint,timestamp:/^The signature is timestamped: (.+)$/m.exec(verify)?.[1]?.trim()??auth.timeStamper};for(const name of ["authenticode.json","verify.txt"]){const path=`${d}/${name}`,b=await Bun.file(`${s}/${path}`).bytes();proof.evidence.push({path,sha256:hash(b),bytes:b.length});}}else{const path=`${d}/policy.json`,b=Buffer.from(JSON.stringify({target:t,policy:proof.policy,rawSha256:raw,unsigned:true}));await Bun.write(`${s}/${path}`,b);proof.evidence.push({path,sha256:hash(b),bytes:b.length});}await Bun.write(`${p}/signing.json`,JSON.stringify(proof,null,2)+"\n");'
          bun qualitylayer/scripts/memory-qualification-stage.ts target --source-root "$PWD/qualitylayer" --payload-dir "$RUNNER_TEMP/piece" --target "$TARGET" --raw "$RUNNER_TEMP/engine/engram"
          bun qualitylayer/scripts/memory-qualification-run.ts --source-root "$PWD/qualitylayer" --payload-dir "$RUNNER_TEMP/piece" --target "$TARGET" --signing-receipt "$RUNNER_TEMP/signing.json" --previous-payload "$RUNNER_TEMP/previous-engine" --previous-manifest "$RUNNER_TEMP/previous-manifest.json" --out "$RUNNER_TEMP/piece/receipts/$TARGET.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-payload-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/piece/
          retention-days: 7

  payload-readiness:
    needs: memory-payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      provenance_sha256: ${{ steps.provenance.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - run: bash .github/workflows/scripts/install-git-crypt.sh
      - env: { GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}" }
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
        working-directory: qualitylayer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: memory-payload-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pieces
      - name: Validate five native cells and bind their exact receipts
        id: provenance
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            mv "$RUNNER_TEMP/pieces/memory-payload-$target-$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/pieces/$target"
          done
          bun qualitylayer/scripts/memory-qualification-stage.ts merge --source-root "$PWD/qualitylayer" --pieces "$RUNNER_TEMP/pieces" --payload-dir "$RUNNER_TEMP/stage"
          bun qualitylayer/scripts/memory-qualification.ts payload --source-root "$PWD/qualitylayer" --payload-dir "$RUNNER_TEMP/stage" --out "$RUNNER_TEMP/stage/payload-set.json"
          # JavaScript template expressions must stay unexpanded by the shell.
          # shellcheck disable=SC2016
          bun -e 'const p=process.env.RUNNER_TEMP+"/stage",b=await Bun.file(p+"/payload-set.json").bytes(),s=JSON.parse(new TextDecoder().decode(b));const v={schema:1,kind:"memory-payload-authorization",repository:process.env.GITHUB_REPOSITORY,workflow:".github/workflows/qualitylayer-candidate.yml",sourceCommit:s.sourceCommit,sourceTree:s.sourceTree,runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),payloadSetSha256:new Bun.CryptoHasher("sha256").update(b).digest("hex"),receipts:s.receipts};await Bun.write(p+"/provenance.json",JSON.stringify(v,null,2)+"\n");'
          echo "sha256=$(sha256sum "$RUNNER_TEMP/stage/provenance.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-payload-stage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage/
          retention-days: 7

  payload-authorization:
    name: Authorize the qualified payload bytes
    needs: payload-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.authorization_environment }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: memory-payload-stage-${{ github.run_attempt }}
          path: stage
      # Only native hash/JSON/signature tools run here; no source, engine, package or product executes.
      - name: Sign the trusted same-run payload authorization
        env:
          EXPECTED_SHA256: ${{ needs.payload-readiness.outputs.provenance_sha256 }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNER: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOvc89TsfxkzK1lxTNLr/FHwImLq1oUWYmmXQ1iYL2oU
        run: |
          set -euo pipefail
          [ "$(sha256sum stage/provenance.json | awk '{print $1}')" = "$EXPECTED_SHA256" ]
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '.kind == "memory-payload-authorization" and .repository == "maxritter/qualitylayer" and .workflow == ".github/workflows/qualitylayer-candidate.yml" and .sourceCommit == $sha and .runId == $run and .runAttempt == $attempt and (.receipts | keys | sort) == ["darwin-arm64","darwin-x64","linux-arm64","linux-x64","win32-x64"]' stage/provenance.json
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            expected=$(jq -r --arg target "$target" '.receipts[$target]' stage/provenance.json)
            [ "$(sha256sum "stage/receipts/$target.json" | awk '{print $1}')" = "$expected" ]
            jq -e --arg sha "$GITHUB_SHA" --arg target "$target" '.status == "passed" and .target == $target and .sourceCommit == $sha' "stage/receipts/$target.json"
          done
          key="${RUNNER_TEMP:?}/payload-signing-key"
          trap 'rm -f "$key"' EXIT
          [ -n "$RELEASE_SIGNING_KEY" ]
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          ssh-keygen -Y sign -f "$key" -n qualitylayer-release stage/provenance.json
          printf 'release@qualitylayer.dev namespaces="qualitylayer-release" %s\n' "$RELEASE_SIGNER" > "$RUNNER_TEMP/allowed-signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed-signers" -I release@qualitylayer.dev -n qualitylayer-release -s stage/provenance.json.sig < stage/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-payload-signature-${{ github.run_attempt }}
          path: stage/provenance.json.sig
          retention-days: 7

  build:
    name: Build QualityLayer (6 targets)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: payload-authorization
    if: needs.payload-authorization.result == 'success'
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      - name: Download qualified payload bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: memory-payload-stage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payload-stage
      - name: Download payload authorization
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: memory-payload-signature-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payload-stage

      # Release builds trust only the trial service's key (no development key).
      - name: Build release binaries
        working-directory: qualitylayer
        env:
          QUALITYLAYER_VERSION: ${{ inputs.version }}
          QUALITYLAYER_MEMORY_PAYLOAD_STAGE: ${{ runner.temp }}/payload-stage
        run: bun run build --all

      # The binary this run publishes for Linux, started from / with an empty HOME, must
      # serve its own page, script and stylesheet and draw in Chrome. beta.1 to beta.5
      # served a white page; nothing reaches Approve Release past this step any more.
      - name: The release Cockpit draws
        working-directory: qualitylayer
        run: bun scripts/check-cockpit.ts dist/release/qualitylayer-linux-x64 --same-source --require-render

      # Release binaries carry no phase texts; qualitylayer.dev serves them. Only the
      # digest of the served texts leaves this job: the publishing job rebuilds the
      # texts from the same commit and must arrive at it, and the texts themselves never
      # become an artifact.
      - name: Digest of the workflow texts
        id: bundle
        working-directory: qualitylayer
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest in: $out"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          rm -f "${RUNNER_TEMP:?}/workflow-bundle.json"

      - name: Smoke-test the Linux x64 binary
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          ACTUAL=$(qualitylayer/dist/release/qualitylayer-linux-x64 --version)
          echo "built: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Collect release assets
        run: |
          mkdir -p release
          cp qualitylayer/dist/release/qualitylayer-* release/
          cp install.sh release/install.sh
          cp install.ps1 release/install.ps1
          (cd release && sha256sum install.sh > install.sh.sha256)
          (cd release && sha256sum install.ps1 > install.ps1.sha256)
          (cd release && sha256sum -c ./*.sha256)

      # The command line's files only; the asset guard looks at the whole list once the App's
      # packages have joined it, in assemble-release.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-release-cli-${{ github.run_attempt }}
          path: release/
          retention-days: 1

  # One package per system, each built natively around the command line this run built, so
  # the App carries the very binary that is published. The Mac packages are signed with the
  # Developer ID and notarized, the Windows CLI and setup with Authenticode (Azure Artifact
  # Signing); every package's update file is then signed with the update key.
  app:
    name: App package (${{ matrix.name }})
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: ${{ inputs.authorization_environment }}
    needs: build
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, target: darwin-arm64, os: macos-26 }
          - { name: macos-x64, target: darwin-x64, os: macos-15-intel }
          - { name: windows-x64, target: windows-x64, os: windows-2025 }
          - { name: linux-x64, target: linux-x64, os: ubuntu-22.04 }
          - { name: linux-arm64, target: linux-arm64, os: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks out CRLF by default; git-crypt (msys2's git) then sees the whole
      # tree as modified and refuses to unlock.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # The package needs only the App's own sources and its packaging script (the command line
      # comes from this run's build): a sparse checkout leaves the rest encrypted and unread, so
      # unlocking decrypts some 50 files instead of every one (minutes on Windows).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github
            qualitylayer/app
            qualitylayer/scripts

      - name: Install git-crypt
        if: runner.os != 'Windows'
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Setup git-crypt
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          install: git git-crypt
          update: true
          path-type: inherit

      - name: Unlock repository
        if: runner.os != 'Windows'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Unlock repository (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Toolchain for the App (Rust, Tauri, the system libraries)
        uses: ./.github/actions/app-toolchain

      # The App's compiled dependencies, per platform: a release then compiles only what changed
      # instead of every crate (ten minutes on the Intel Mac). Only release runs on main and dev
      # write it; the packages themselves (bundle/) are never cached.
      - name: Cached App build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            qualitylayer/app/src-tauri/target
            qualitylayer/app/launcher/target
            !qualitylayer/app/src-tauri/target/**/bundle
          key: app-target-${{ matrix.target }}-${{ hashFiles('qualitylayer/app/**/Cargo.lock') }}
          restore-keys: app-target-${{ matrix.target }}-

      # The certificate goes into a keychain of its own that lives as long as this job.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP:?}/ql-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "${RUNNER_TEMP:?}/certificate.p12"
          security import "${RUNNER_TEMP:?}/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP:?}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"

      - name: Download the command line this run built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release-cli-${{ github.run_attempt }}
          path: release

      # Windows signs with Azure Artifact Signing (Public Trust): the standalone CLI here, then
      # Tauri signs the App, the launcher, the NSIS plugins, the uninstaller and the setup with the
      # same command before it writes the updater signature. Without an active certificate profile
      # the preflight warns and the Windows package is built unsigned, as before.
      - name: Windows signing
        id: signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-signing
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.AZURE_SIGNING_RESOURCE_GROUP }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}

      # Tauri leaves an already signed sidecar alone, so the App carries the very bytes published.
      - name: Sign the standalone Windows CLI
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'qualitylayer-windows-x64.exe'
          $cli = Join-Path $PWD "release/$name"
          $expected = ((Get-Content "$cli.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash -ne $expected) { throw 'The CLI is not the one this run built' }
          & ./.github/workflows/scripts/windows-sign.ps1 -Path $cli
          & ./.github/workflows/scripts/verify-authenticode.ps1 -Path $cli
          $actual = & $cli --version
          if ($LASTEXITCODE -ne 0 -or "$actual".Trim() -ne $env:VERSION) { throw "The signed CLI does not run: $actual" }
          $hash = (Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$cli.sha256", "$hash  $name`n")

      - name: Finalize the standalone Mac CLI signature
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cli="release/qualitylayer-$TARGET"
          chmod 755 "$cli"
          identity=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$identity" ]
          codesign --force --timestamp --options runtime --entitlements qualitylayer/app/src-tauri/entitlements.plist --identifier dev.qualitylayer.cli --sign "$identity" "$cli"
          codesign --verify --strict "$cli"
          zip -j -X "$RUNNER_TEMP/standalone-cli.zip" "$cli"
          key="$RUNNER_TEMP/standalone-notary.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$ASC_PRIVATE_KEY" > "$key")
          xcrun notarytool submit "$RUNNER_TEMP/standalone-cli.zip" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json > "$RUNNER_TEMP/standalone-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/standalone-notary.json"

      - name: Build the package
        working-directory: qualitylayer
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          notarize=()
          if [ "$RUNNER_OS" = macOS ]; then notarize=(--notarize); fi
          bun scripts/app.ts --release "${notarize[@]}" --version "$VERSION" \
            --targets "$TARGET" --cli-dir ../release

      - name: A Mac package is accepted by Gatekeeper
        if: runner.os == 'macOS'
        run: |
          for dmg in qualitylayer/dist/app/release/*.dmg; do
            spctl -a -vv -t install "$dmg" 2>&1 | tee "${RUNNER_TEMP:?}/spctl.txt"
            grep -q "source=Notarized Developer ID" "${RUNNER_TEMP:?}/spctl.txt"
            for attempt in 1 2 3; do
              if xcrun stapler validate "$dmg"; then
                break
              else
                status=$?
                # Apple can drop the CloudKit connection after accepting and stapling the package.
                [ "$status" -eq 68 ] && [ "$attempt" -lt 3 ] || exit "$status"
                sleep 5
              fi
            done
          done

      # The setup, and everything it installs including its uninstaller, carries the signature; the
      # installed CLI is byte for byte the standalone one. A silent per-user install skips the
      # optional Defender repair (hooks.nsh), so it changes nothing on the runner's security.
      - name: Every Windows file is signed
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem -LiteralPath 'qualitylayer/dist/app/release' -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "Expected one setup, found $($setup.Count)" }
          & ./.github/workflows/scripts/verify-authenticode.ps1 -Path $setup[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP 'ql-signed-install'
          $install = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The setup failed silently ($($install.ExitCode))" }
          foreach ($name in 'QualityLayer.exe', 'qualitylayer-cli.exe', 'qualitylayer-launcher.exe', 'uninstall.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $name))) { throw "The setup did not install $name" }
          }
          $files = @(Get-ChildItem -LiteralPath $dir -Recurse -File -Include '*.exe', '*.dll' | ForEach-Object FullName)
          & ./.github/workflows/scripts/verify-authenticode.ps1 -Path $files
          $standalone = (Get-FileHash -LiteralPath 'release/qualitylayer-windows-x64.exe' -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath (Join-Path $dir 'qualitylayer-cli.exe') -Algorithm SHA256).Hash -ne $standalone) {
            throw 'The App carries a different CLI than the standalone download'
          }

      # Signed or (without a certificate profile) the build's own bytes: the native Windows check
      # downloads the CLI from this package either way.
      - name: Retain the exact standalone Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'qualitylayer-windows-x64.exe', 'qualitylayer-windows-x64.exe.sha256') {
            Copy-Item -LiteralPath "release/$name" -Destination "qualitylayer/dist/app/release/$name" -Force
          }

      - name: Retain the exact signed standalone Mac CLI
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cli="qualitylayer-$TARGET"
          cp "release/$cli" "qualitylayer/dist/app/release/$cli"
          (cd qualitylayer/dist/app/release && shasum -a 256 "$cli" > "$cli.sha256")

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.name }}-${{ github.run_attempt }}
          path: qualitylayer/dist/app/release/
          retention-days: 1

  # The whole release list in one place: the command line, the packages, their signatures,
  # their checksums and latest.json. Nothing but these may ever be attached: no source, no
  # source maps, nothing from the encrypted tree.
  assemble-release:
    name: Assemble Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
      artifact_digest: ${{ steps.assets.outputs.artifact-digest }}
    needs: [build, app]
    if: needs.build.result == 'success' && needs.app.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Download the compiled command lines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release-cli-${{ github.run_attempt }}
          path: release
      # Mac and Windows packages carry their natively signed CLI and checksum; replace only those
      # known files.
      - name: Download the native packages and finalized Mac and Windows CLIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-*-${{ github.run_attempt }}
          path: release
          merge-multiple: true

      # The installers verify a package against its .sha256; the updater verifies the .sig.
      - name: Checksums and the updater's manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd release
          for package in QualityLayer-*.dmg QualityLayer-*-setup.exe QualityLayer-*.AppImage; do
            sha256sum "$package" > "$package.sha256"
          done
          cd ..
          bun qualitylayer/scripts/app.ts --latest-json release --version "$VERSION" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          # The notes ride in the manifest, so the App's update sheet says what the release says.
          bash .github/scripts/changelog-section.sh "$VERSION" > "${RUNNER_TEMP:?}/release-notes.md"
          jq --rawfile notes "${RUNNER_TEMP:?}/release-notes.md" '. + {notes: $notes}' \
            release/latest.json > "${RUNNER_TEMP:?}/latest.json"
          mv "${RUNNER_TEMP:?}/latest.json" release/latest.json
          (cd release && sha256sum -c ./*.sha256)

      - name: Guard the asset list
        run: |
          cd release
          ls -la
          ALLOWED='^(qualitylayer-(darwin|linux)-(arm64|x64)(\.sha256)?|qualitylayer-windows-x64\.exe(\.sha256)?|install\.(sh|ps1)(\.sha256)?|QualityLayer-[0-9][0-9A-Za-z.-]*-(macos-(arm64|x64)\.dmg(\.sha256)?|macos-(arm64|x64)\.app\.tar\.gz(\.sig)?|x64-setup\.exe(\.sha256|\.sig)?|linux-(arm64|x64)\.AppImage(\.sha256|\.sig)?)|latest\.json)$'
          BAD=$(find . -type f -printf '%f\n' | grep -vE "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "Refusing to publish unexpected assets:"
            echo "$BAD"
            exit 1
          fi
          [ "$(find . -type f | wc -l)" -eq 32 ]

      - name: Upload artifact
        id: assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-candidate-assets-${{ github.run_attempt }}
          path: release/
          retention-days: 1

  windows-release:
    name: Native Windows release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [build, app]
    if: needs.build.result == 'success' && needs.app.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
    defaults:
      run:
        shell: pwsh
    steps:
      # Git for Windows checks out CRLF by default; git-crypt (msys2's git) then sees the whole
      # tree as modified and refuses to unlock.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      # The job checks the published binary; from the tree it needs only the Cockpit check and the
      # one core module it imports. A sparse checkout decrypts those instead of every file.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github
            qualitylayer/scripts
            qualitylayer/src/core
            qualitylayer/src/server

      - name: Setup git-crypt
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          install: git git-crypt
          update: true
          path-type: inherit

      - name: Unlock repository
        shell: msys2 {0}
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      # The signed CLI and setup the Windows App job finalized: the bytes the release publishes.
      - name: Download exact release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-windows-${{ matrix.arch }}-${{ github.run_attempt }}
          path: release

      # All signed by one validated signer, or (no certificate profile yet) all unsigned with a warning.
      - name: The published Windows files are signed alike
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object FullName)
          if ($files.Count -ne 2) { throw "Expected the CLI and the setup, found: $($files -join ', ')" }
          & ./.github/workflows/scripts/verify-authenticode.ps1 -Consistent -Path $files

      - name: Verify checksum and version on the native OS
        env:
          QL_ARCH: ${{ matrix.arch }}
          QL_VERSION: ${{ inputs.version }}
        run: |
          $qlFile = Join-Path $PWD "release/qualitylayer-windows-$env:QL_ARCH.exe"
          $qlExpected = ((Get-Content "$qlFile.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $qlFile -Algorithm SHA256).Hash -ne $qlExpected) { throw 'Windows binary checksum mismatch' }
          $qlActual = & $qlFile --version
          if ($LASTEXITCODE -ne 0 -or $qlActual.Trim() -ne $env:QL_VERSION) { throw "Windows version mismatch: $qlActual" }
          $qlParent = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Temp'
          $qlHome = Join-Path $qlParent ("ql-native-release-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $qlHome -ErrorAction Stop | Out-Null
          $qlSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $qlHome /inheritance:r /grant:r "*${qlSid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' /q
          if ($LASTEXITCODE -ne 0) { throw 'Private Windows release account ACL protection failed' }
          New-Item -ItemType Directory -Path "$qlHome/.claude", "$qlHome/.codex" -Force | Out-Null
          $env:HOME = $qlHome
          $env:USERPROFILE = $qlHome
          $env:QUALITYLAYER_HOME = Join-Path $qlHome '.qualitylayer'
          $env:QUALITYLAYER_API_BASE = 'http://127.0.0.1:9'
          $env:POLAR_API_BASE = 'http://127.0.0.1:9'
          $qlEvidence = @()
          $qlDirectory = [IO.DirectoryInfo]::new($qlHome)
          while ($null -ne $qlDirectory) {
            if ($qlDirectory.Exists) {
              $qlAcl = Get-Acl -LiteralPath $qlDirectory.FullName
              $qlRules = @($qlAcl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | ForEach-Object {
                @{ sid = $_.IdentityReference.Value; rights = [int64]$_.FileSystemRights; allow = ($_.AccessControlType -eq 'Allow'); inheritOnly = (([int]$_.PropagationFlags -band 2) -ne 0) }
              })
              $qlEvidence += @{ path = $qlDirectory.FullName; owner = $qlAcl.GetOwner([Security.Principal.SecurityIdentifier]).Value; rules = $qlRules }
            }
            $qlDirectory = $qlDirectory.Parent
          }
          $qlEvidence | ConvertTo-Json -Depth 6 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'ql-release-account-acls.json')
          & $qlFile install --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Windows release install failed' }
          $qlInstalled = Join-Path $qlHome '.qualitylayer/bin/qualitylayer.exe'
          & $qlInstalled --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows release failed to run' }
          & $qlInstalled uninstall --purge --json
          if ($LASTEXITCODE -ne 0 -or (Test-Path "$qlHome/.qualitylayer")) { throw 'Windows release uninstall failed' }

      - name: Keep the disposable Windows account ACL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-account-acls-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ql-release-account-acls.json
          if-no-files-found: ignore
          retention-days: 7

      - name: The published Windows Cockpit draws
        working-directory: qualitylayer
        env:
          QL_ARCH: ${{ matrix.arch }}
        run: bun scripts/check-cockpit.ts "../release/qualitylayer-windows-$env:QL_ARCH.exe" --same-source --require-render

  catalog-signing:
    name: Sign the fixed candidate catalog
    needs: assemble-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.authorization_environment }}
    outputs:
      artifact_id: ${{ steps.catalog.outputs.artifact-id }}
      artifact_digest: ${{ steps.catalog.outputs.artifact-digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-candidate-assets-${{ github.run_attempt }}
          path: release
      # No source checkout, Bun, native product or package executes in this signing job.
      - name: Sign only the known final assets
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNER: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOvc89TsfxkzK1lxTNLr/FHwImLq1oUWYmmXQ1iYL2oU
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^12\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          expected=()
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64.exe; do
            expected+=("qualitylayer-$target" "qualitylayer-$target.sha256")
          done
          for script in install.sh install.ps1; do expected+=("$script" "$script.sha256"); done
          for arch in arm64 x64; do
            expected+=("QualityLayer-$VERSION-macos-$arch.dmg" "QualityLayer-$VERSION-macos-$arch.dmg.sha256" "QualityLayer-$VERSION-macos-$arch.app.tar.gz" "QualityLayer-$VERSION-macos-$arch.app.tar.gz.sig")
            package="QualityLayer-$VERSION-linux-$arch.AppImage"
            expected+=("$package" "$package.sha256" "$package.sig")
          done
          package="QualityLayer-$VERSION-x64-setup.exe"
          expected+=("$package" "$package.sha256" "$package.sig")
          expected+=(latest.json)
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets"
          [ -z "$(find release -mindepth 1 -maxdepth 1 ! -type f -print)" ]
          [ -z "$(find release -type f -size +1G -print)" ]
          find release -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          jq -e --arg version "$VERSION" '.version == $version' release/latest.json
          (cd release && sha256sum -c ./*.sha256)
          (cd release && printf '%s\n' "${expected[@]}" | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          key="$RUNNER_TEMP/catalog-signing-key"
          trap 'rm -f "$key"' EXIT
          [ -n "$RELEASE_SIGNING_KEY" ]
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          ssh-keygen -Y sign -f "$key" -n qualitylayer-release release/SHA256SUMS
          printf 'release@qualitylayer.dev namespaces="qualitylayer-release" %s\n' "$RELEASE_SIGNER" > "$RUNNER_TEMP/allowed-signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed-signers" -I release@qualitylayer.dev -n qualitylayer-release -s release/SHA256SUMS.sig < release/SHA256SUMS
          mkdir "$RUNNER_TEMP/catalog"
          cp release/SHA256SUMS release/SHA256SUMS.sig "$RUNNER_TEMP/catalog/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: catalog
        with:
          name: qualitylayer-candidate-catalog-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog/
          retention-days: 7

  memory-distribution:
    name: Final native memory distribution (${{ matrix.target }})
    needs: [catalog-signing, payload-authorization]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-26, arch: arm64 }
          - { target: darwin-x64, os: macos-15-intel, arch: x64 }
          - { target: linux-x64, os: ubuntu-22.04, arch: x64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, arch: arm64 }
          - { target: win32-x64, os: windows-2025, arch: x64 }
    defaults:
      run: { shell: bash }
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"
          bun-download-url: ${{ runner.os == 'Windows' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64.zip' || '' }}
      - if: runner.os != 'Windows'
        run: bash .github/workflows/scripts/install-git-crypt.sh
      - if: runner.os != 'Windows'
        env: { GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}" }
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - name: Unlock repository on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "qualitylayer-candidate-assets-${{ github.run_attempt }}",
            path: "${{ runner.temp }}/release",
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "qualitylayer-candidate-catalog-${{ github.run_attempt }}",
            path: "${{ runner.temp }}/release",
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "memory-payload-stage-${{ github.run_attempt }}",
            path: "${{ runner.temp }}/payload-stage",
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "memory-payload-signature-${{ github.run_attempt }}",
            path: "${{ runner.temp }}/payload-stage",
          }
      - name: Download the published stable 12.0.0 distribution once for this target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          previous=12.0.0
          mkdir "$RUNNER_TEMP/previous"
          case "$TARGET" in
            darwin-*) cli="qualitylayer-$TARGET"; package="QualityLayer-$previous-macos-${TARGET#darwin-}.dmg"; installer=install.sh ;;
            linux-*) cli="qualitylayer-$TARGET"; package="QualityLayer-$previous-$TARGET.AppImage"; installer=install.sh ;;
            win32-*) cli="qualitylayer-windows-${TARGET#win32-}.exe"; package="QualityLayer-$previous-${TARGET#win32-}-setup.exe"; installer=install.ps1 ;;
            *) exit 1 ;;
          esac
          gh release download "v$previous" --repo maxritter/qualitylayer --pattern "$cli" --pattern "$package" --pattern "$installer" --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir "$RUNNER_TEMP/previous"
          printf 'PREVIOUS_CLI=%s\nPREVIOUS_PACKAGE=%s\n' "$RUNNER_TEMP/previous/$cli" "$RUNNER_TEMP/previous/$package" >> "$GITHUB_ENV"
      - name: Execute both real installer and upgrade routes in the disposable principal
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun qualitylayer/scripts/qualify-memory-distribution.ts --source-root "$PWD/qualitylayer" --target "$TARGET" --version "$VERSION" --release-dir "$RUNNER_TEMP/release" --payload-dir "$RUNNER_TEMP/payload-stage" --previous-dir "$RUNNER_TEMP/previous" --previous-cli "$PREVIOUS_CLI" --previous-package "$PREVIOUS_PACKAGE" --out-root "$RUNNER_TEMP/distribution"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-distribution-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution/
          retention-days: 7

  distribution-readiness:
    name: Freeze the successful candidate identity
    needs:
      [
        memory-distribution,
        windows-release,
        assemble-release,
        catalog-signing,
        build,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - run: bash .github/workflows/scripts/install-git-crypt.sh
      - env: { GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}" }
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
        working-directory: qualitylayer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "qualitylayer-candidate-assets-${{ github.run_attempt }}",
            path: release,
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "qualitylayer-candidate-catalog-${{ github.run_attempt }}",
            path: release,
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "memory-payload-stage-${{ github.run_attempt }}",
            path: payload-stage,
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: "memory-payload-signature-${{ github.run_attempt }}",
            path: payload-stage,
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: memory-distribution-*-${{ github.run_attempt }}
          path: distribution
          merge-multiple: true
      - name: Validate all five final native receipts without touching public assets
        run: bun qualitylayer/scripts/memory-qualification.ts distribution --source-root "$PWD/qualitylayer" --release-dir "$PWD/release" --receipts "$PWD/distribution" --payload-dir "$PWD/payload-stage" --out "$RUNNER_TEMP/distribution-set.json"
      - name: Bind immutable artifact IDs and Root-installable file hashes
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
          ASSETS_ID: ${{ needs.assemble-release.outputs.artifact_id }}
          ASSETS_DIGEST: ${{ needs.assemble-release.outputs.artifact_digest }}
          CATALOG_ID: ${{ needs.catalog-signing.outputs.artifact_id }}
          CATALOG_DIGEST: ${{ needs.catalog-signing.outputs.artifact_digest }}
          BUNDLE_DIGEST: ${{ needs.build.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate"
          bun qualitylayer/scripts/release-candidate.ts manifest --version "$VERSION" --release-dir "$PWD/release" --receipts "$PWD/distribution" --distribution-set "$RUNNER_TEMP/distribution-set.json" --payload-set "$PWD/payload-stage/payload-set.json" --bundle-digest "$BUNDLE_DIGEST" --assets-id "$ASSETS_ID" --assets-digest "$ASSETS_DIGEST" --catalog-id "$CATALOG_ID" --catalog-digest "$CATALOG_DIGEST" --out "$RUNNER_TEMP/candidate/candidate.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/candidate/candidate.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-candidate-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/candidate.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualitylayer-candidate-receipts-${{ github.run_attempt }}
          path: |
            distribution/
            ${{ runner.temp }}/distribution-set.json
          retention-days: 7
