---
name: Test Coverage

"on":
  push:
    branches:
      - main
      - dev
      - "claude/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  binary-check:
    name: Check for Binary/Encrypted Test Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Verify test files are not binary after unlock
        run: |
          echo "Checking that test files are readable TypeScript (not binary/encrypted)..."
          FAILED=0
          while IFS= read -r -d '' file; do
            TYPE=$(file --brief "$file")
            case "$TYPE" in
              *ASCII*|*UTF-8*|*empty*)
                # readable text — OK
                ;;
              *)
                echo "ERROR: Binary or unreadable file: $file ($TYPE)"
                FAILED=1
                ;;
            esac
          done < <(find console/tests/ -type f -name "*.ts" -print0)
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Files appear binary. Likely cause: GIT_CRYPT_KEY secret is missing or invalid."
            exit 1
          fi
          echo "All test files are valid text — git-crypt unlock succeeded."

  console-tests:
    name: Console Unit Tests with Coverage
    runs-on: ubuntu-latest
    needs: binary-check
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: console
        run: bun install

      - name: Run tests with coverage
        working-directory: console
        run: bun test --coverage

      - name: Publish coverage summary
        if: always()
        run: |
          echo "### Console Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed. See job logs for detailed coverage report." >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-coverage
          path: console/coverage/
          retention-days: 7

  python-tests:
    name: Python Unit Tests with Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install . pytest pytest-cov pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          python3 -m pytest installer/tests/unit/ launcher/tests/unit/ pilot/hooks/tests/ -v \
            --cov=installer --cov=launcher --cov=pilot.hooks \
            --cov-report=term --cov-report=xml --cov-report=html

      - name: Publish coverage summary
        if: always()
        run: |
          echo "### Python Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0)) * 100
          print(f'{line_rate:.1f}%')
          " 2>/dev/null || echo "N/A")
            echo "Overall line coverage: **${COVERAGE}**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
