---
name: Deploy Website

"on":
  push:
    branches:
      - main
      - dev
    paths:
      - "docs/site/**"
      - "docs/docusaurus/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# One deployment at a time per branch: a newer commit replaces an older one, and
# main (production) is never cancelled by dev (the beta Preview), nor the reverse.
concurrency:
  group: deploy-website-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-trigger:
    name: Check Deploy Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check commit type
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s)
          # Only deploy for chore/docs/style commits — fix/feat go through release pipeline
          if echo "$COMMIT_MSG" | grep -qE "^(chore|docs|style|build|ci|refactor):"; then
            echo "Website-only commit detected — deploying"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release commit (fix/feat) — skipping, release pipeline handles deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  link-check:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # docs/docusaurus is not git-crypt encrypted, so no unlock is needed here.
      # External-URL flakiness is mitigated via retries + the exclusions in .github/lychee.toml.
      #
      # Scope: external http(s) links only. Internal links are Docusaurus's job --
      # it builds with `onBrokenLinks: "throw"`, so it validates its own routes with
      # full knowledge of them. lychee cannot: it resolves `/docs/workflows/spec` to a
      # path on disk and never finds it, because the file is `.../spec.md` and lychee
      # does not append extensions. `--root-dir` lets it build those URLs instead of
      # erroring, and `--scheme` then drops the resulting file:// links unchecked.
      #
      # 403/429 are accepted on top of lychee's default range. News and media hosts
      # cited in the blog refuse datacenter clients outright (axios, venturebeat), so
      # those codes mean "this host won't talk to CI", not "this link is broken".
      # 404 stays a failure -- that is what catches genuinely dead links.
      #
      # `--` is required: `--scheme` and `--accept` take multiple values and would
      # otherwise swallow the inputs that follow them.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: "--config .github/lychee.toml --no-progress --max-retries 3 --retry-wait-time 2 --root-dir ${{ github.workspace }} --scheme http --scheme https --accept 100..=103,200..=299,403,429 -- docs/docusaurus/docs docs/docusaurus/blog README.md"
          fail: true

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, link-check]
    if: needs.check-trigger.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      # The site's tests run before anything touches a database or the domain; a failing test
      # stops the deploy. The database seam also runs under the edge runtime the routes see.
      - name: Test the site
        working-directory: docs/site
        run: npm test

      - name: Test the database seam under the edge runtime
        working-directory: docs/site
        run: npm run test:edge

      # The schema of the environment being deployed goes first; a failed migration stops the deploy.
      - name: Apply the database schema
        working-directory: docs/site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
          VERCEL_PROJECT_ID: prj_TXccrJI83HyNvQUZxqStUFgus9NB
        run: |
          pull="${RUNNER_TEMP:?}/database.env"
          if [ "$GITHUB_REF_NAME" = main ]; then
            vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          else
            vercel env pull "$pull" --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN" --yes
          fi
          DATABASE_URL="$(sed -n 's/^DATABASE_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$pull")"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL is not set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          node scripts/db-migrate.ts

      # main is production. dev is a Preview of the same project, which qualitylayer.dev
      # is aliased to; only the tip of dev may take the domain, so a slower run never
      # puts an older page over a newer one.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
          VERCEL_PROJECT_ID: prj_TXccrJI83HyNvQUZxqStUFgus9NB
        run: |
          umask 077
          receipt="${RUNNER_TEMP:?}/website-deployment.json"
          runtime="${RUNNER_TEMP:?}/website-runtime.json"
          verifier=docs/site/scripts/verify-deployment-runtime.mjs
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          if [ "$GITHUB_REF_NAME" = main ]; then
            target=production
            vercel deploy --token="$VERCEL_TOKEN" --prod --json --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" > "$receipt"
          else
            target=preview
            vercel deploy --token="$VERCEL_TOKEN" --target preview --json --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" > "$receipt"
          fi
          deployment_id=$(node "$verifier" receipt-id --deployment "$receipt")
          vercel api "/v13/deployments/$deployment_id" --method GET --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --raw > "$runtime"
          DEPLOY_URL=$(node "$verifier" verify --deployment "$receipt" --metadata "$runtime" --project "$VERCEL_PROJECT_ID" --target "$target" --git-ref "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA")
          bash docs/site/scripts/check-deploy.sh "$DEPLOY_URL"
          echo "Deployed to: $DEPLOY_URL"
          if [ "$GITHUB_REF_NAME" = main ]; then exit 0; fi
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_REF_NAME moved past $GITHUB_SHA; the domain stays on the newer deployment"
            exit 0
          fi
          for domain in qualitylayer.dev www.qualitylayer.dev; do
            vercel alias set "$DEPLOY_URL" "$domain" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          done
