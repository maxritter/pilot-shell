---
name: Deploy Website

"on":
  push:
    branches:
      - main
      - dev
    paths:
      - "docs/site/**"
      - "docs/docusaurus/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# One deployment at a time per branch: a newer commit replaces an older one, and
# one branch's deployment never cancels another's.
concurrency:
  group: deploy-website-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-trigger:
    name: Check Deploy Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check commit type
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s)
          # Only deploy for chore/docs/style commits — fix/feat go through release pipeline
          if echo "$COMMIT_MSG" | grep -qE "^(chore|docs|style|build|ci|refactor):"; then
            echo "Website-only commit detected — deploying"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release commit (fix/feat) — skipping, release pipeline handles deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  link-check:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # docs/docusaurus is not git-crypt encrypted, so no unlock is needed here.
      # External-URL flakiness is mitigated via retries + the exclusions in .github/lychee.toml.
      #
      # Scope: external http(s) links only. Internal links are Docusaurus's job --
      # it builds with `onBrokenLinks: "throw"`, so it validates its own routes with
      # full knowledge of them. lychee cannot: it resolves `/docs/workflows/spec` to a
      # path on disk and never finds it, because the file is `.../spec.md` and lychee
      # does not append extensions. `--root-dir` lets it build those URLs instead of
      # erroring, and `--scheme` then drops the resulting file:// links unchecked.
      #
      # 403/429 are accepted on top of lychee's default range. News and media hosts
      # cited in the blog refuse datacenter clients outright (axios, venturebeat), so
      # those codes mean "this host won't talk to CI", not "this link is broken".
      # 404 stays a failure -- that is what catches genuinely dead links.
      #
      # `--` is required: `--scheme` and `--accept` take multiple values and would
      # otherwise swallow the inputs that follow them.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: "--config .github/lychee.toml --no-progress --max-retries 3 --retry-wait-time 2 --root-dir ${{ github.workspace }} --scheme http --scheme https --accept 100..=103,200..=299,403,429 -- docs/docusaurus/docs docs/docusaurus/blog README.md"
          fail: true

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, link-check]
    if: needs.check-trigger.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      # The site's tests run before anything touches a database or the domain; a failing test
      # stops the deploy. The database seam also runs under the edge runtime the routes see.
      - name: Test the site
        working-directory: docs/site
        run: npm test

      - name: Test the database seam under the edge runtime
        working-directory: docs/site
        run: npm run test:edge

      # Frontend checks above cover dev source. The deployed API is separately pinned to the
      # schema-9 service plus the reviewed artifact overlay, without taking launch migration 10.
      - name: Prepare the private schema-9 deployment source
        run: |
          set -euo pipefail
          umask 077
          base=824d98db82ad92e3c172c6e577f22b461df4442b
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --quiet --no-tags --depth=1 origin "$base"
          source="$(mktemp -d "${RUNNER_TEMP:?}/ql-deploy-source.XXXXXX")"
          prepared="${source}-backend"
          echo "DEPLOY_SOURCE=$source" >> "$GITHUB_ENV"
          echo "PREPARED_BACKEND=$prepared" >> "$GITHUB_ENV"
          common="$(git rev-parse --path-format=absolute --git-common-dir)"
          [ -f "$common/git-crypt/keys/default" ] || { echo "::error::git-crypt key is unavailable"; exit 1; }
          git clone --quiet --no-checkout --shared "$GITHUB_WORKSPACE" "$source"
          git -C "$source" remote set-url origin "$(git remote get-url origin)"
          for setting in filter.git-crypt.clean filter.git-crypt.smudge filter.git-crypt.required diff.git-crypt.textconv; do
            git -C "$source" config "$setting" "$(git config --get "$setting")"
          done
          mkdir -p "$source/.git/git-crypt/keys"
          cp "$common/git-crypt/keys/default" "$source/.git/git-crypt/keys/default"
          git -C "$source" checkout --quiet -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          ln -s "$GITHUB_WORKSPACE/docs/site/node_modules" "$source/docs/site/node_modules"
          preparer="$source/docs/site/scripts/prepare-beta-backend.mjs"
          node "$preparer" prepare --repo "$source" --frontend "$GITHUB_SHA" --out "$prepared" >/dev/null
          node "$preparer" verify --prepared "$prepared" --frontend "$GITHUB_SHA"
          mv "$source/docs/site/api" "$prepared/unused-current-api"
          cp -R "$prepared/api" "$source/docs/site/api"
          cp "$prepared/source-lineage.json" "$source/source-lineage.json"
          cp "$prepared/deployment-script-provenance.json" "$source/deployment-script-provenance.json"
          node "$preparer" verify --prepared "$prepared" --frontend "$GITHUB_SHA" --api "$source/docs/site/api"

      - name: Test the prepared schema-9 API and real callers
        working-directory: ${{ env.DEPLOY_SOURCE }}/docs/site
        run: |
          npx vitest run --maxWorkers=2 --dir api
          npx vitest run --maxWorkers=2 scripts/db-beta9.test.ts

      # The schema of the environment being deployed goes first; a failed migration stops the deploy.
      # Migrations run as the database owner (OWNER_DATABASE_URL); the routes may use a narrower role.
      - name: Apply the database schema
        working-directory: ${{ env.DEPLOY_SOURCE }}/docs/site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
          VERCEL_PROJECT_ID: prj_SbOGJL2YBjvq9P5MSjxcrj87IGbi
          PRODUCTION_BRANCH: ${{ vars.SITE_PRODUCTION_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/prepare-beta-backend.mjs verify --prepared "${PREPARED_BACKEND:?}" --frontend "$GITHUB_SHA" --api "${DEPLOY_SOURCE:?}/docs/site/api"
          pull="${RUNNER_TEMP:?}/database.env"
          trap 'rm -f "$pull"' EXIT
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then
            vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          else
            vercel env pull "$pull" --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN" --yes
          fi
          value() { sed -n "s/^$1=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}\$/\\1/p" "$pull"; }
          DATABASE_URL="$(value OWNER_DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || DATABASE_URL="$(value DATABASE_URL)"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::no database is set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export MIGRATION_DATABASE_URL="$DATABASE_URL"
          node scripts/db-migrate.ts
          node scripts/db-beta9.ts

      # qualitylayer.dev is the Production of the Vercel project qualitylayer-site, built from
      # SITE_PRODUCTION_BRANCH (dev until the final release moves it to main). Another branch
      # becomes a protected Preview. The project that serves pilot-shell.com is never deployed
      # to from here. A Production build takes the domains only once its checks pass, and only
      # while it is the branch's tip, so a slower run never puts an older page over a newer one.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
          VERCEL_PROJECT_ID: prj_SbOGJL2YBjvq9P5MSjxcrj87IGbi
          PRODUCTION_BRANCH: ${{ vars.SITE_PRODUCTION_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          umask 077
          receipt="${RUNNER_TEMP:?}/website-deployment.json"
          runtime="${RUNNER_TEMP:?}/website-runtime.json"
          source="${DEPLOY_SOURCE:?}"
          prepared="${PREPARED_BACKEND:?}"
          verifier="$source/docs/site/scripts/verify-deployment-runtime.mjs"
          preparer="$source/docs/site/scripts/prepare-beta-backend.mjs"
          node "$preparer" verify --prepared "$prepared" --frontend "$GITHUB_SHA" --api "$source/docs/site/api"
          backend_base=824d98db82ad92e3c172c6e577f22b461df4442b
          backend_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).overlayDigest)' "$prepared/receipt.json")"
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then
            target=production
            (cd "$source" && vercel deploy --token="$VERCEL_TOKEN" --prod --skip-domain --json --build-env QUALITYLAYER_BACKEND_PROFILE=legacy9 --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" --meta "backendBaseSha=$backend_base" --meta "backendOverlayDigest=$backend_digest") > "$receipt"
          else
            target=preview
            (cd "$source" && vercel deploy --token="$VERCEL_TOKEN" --target preview --json --build-env QUALITYLAYER_BACKEND_PROFILE=legacy9 --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$GITHUB_SHA" --meta "backendBaseSha=$backend_base" --meta "backendOverlayDigest=$backend_digest") > "$receipt"
          fi
          deployment_id=$(node "$verifier" receipt-id --deployment "$receipt")
          vercel api "/v13/deployments/$deployment_id" --method GET --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --raw > "$runtime"
          DEPLOY_URL=$(node "$verifier" verify --deployment "$receipt" --metadata "$runtime" --project "$VERCEL_PROJECT_ID" --target "$target" --git-ref "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA")
          node "$preparer" verify-runtime --prepared "$prepared" --frontend "$GITHUB_SHA" --api "$source/docs/site/api" --metadata "$runtime"
          bash "$source/docs/site/scripts/check-deploy.sh" "$DEPLOY_URL"
          echo "Deployed to: $DEPLOY_URL"
          if [ "$target" != production ]; then exit 0; fi
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_REF_NAME moved past $GITHUB_SHA; the domain stays on the newer deployment"
            exit 0
          fi
          vercel promote "$DEPLOY_URL" --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Remove private deployment sources
        if: always()
        run: |
          for path in "${DEPLOY_SOURCE:-}" "${PREPARED_BACKEND:-}"; do
            case "$path" in
              "${RUNNER_TEMP:?}"/ql-deploy-source.*) rm -rf -- "$path" ;;
              "") ;;
              *) echo "::error::refusing to remove an unexpected deployment path"; exit 1 ;;
            esac
          done
