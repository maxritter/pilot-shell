name: Archived baseline read access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the exact draft baseline with the hosted read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/archived-baseline"
          mkdir "$work"
          trap 'rm -rf "$work"' EXIT
          gh release view v12.0.0-beta.57 --repo maxritter/qualitylayer --json isDraft,tagName > "$work/release.json"
          jq -e '.isDraft == true and .tagName == "v12.0.0-beta.57"' "$work/release.json"
          gh release download v12.0.0-beta.57 --repo maxritter/qualitylayer \
            --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir "$work"
          printf '%s\n' \
            '8c2f7a18f1f802b44377263de35de896e9ff9704267c9ca488a4f1d75bf50e4f  SHA256SUMS' \
            'c2abe38d88f4674758a74a3bd3083675d301e0921779b23f3b839b2b7f6a2cfb  SHA256SUMS.sig' > "$work/pins"
          (cd "$work" && sha256sum --check pins)
          printf '%s\n' 'release@qualitylayer.dev namespaces="qualitylayer-release" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOvc89TsfxkzK1lxTNLr/FHwImLq1oUWYmmXQ1iYL2oU release@qualitylayer.dev' > "$work/allowed-signers"
          ssh-keygen -Y verify -f "$work/allowed-signers" -I release@qualitylayer.dev \
            -n qualitylayer-release -s "$work/SHA256SUMS.sig" < "$work/SHA256SUMS"
          cp "$work/SHA256SUMS" "$work/tampered"
          printf 'tampered\n' >> "$work/tampered"
          if ssh-keygen -Y verify -f "$work/allowed-signers" -I release@qualitylayer.dev \
            -n qualitylayer-release -s "$work/SHA256SUMS.sig" < "$work/tampered"; then
            echo '::error::Tampered baseline catalog was accepted'
            exit 1
          fi
          printf '%s\n' 'Hosted GITHUB_TOKEN contents:read retrieved the genuine drafted beta.57 catalog and signature; pinned bytes and release signature passed, changed bytes refused. No installer executed.' >> "$GITHUB_STEP_SUMMARY"
