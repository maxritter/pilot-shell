name: Windows diagnostics (temporary)

on:
  push:
    branches:
      - ci/windows-speed

permissions:
  contents: read

jobs:
  diag:
    name: Windows diag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Audit process creation with command lines
        run: |
          auditpol /set /subcategory:"Process Creation" /success:enable
          New-Item -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit' -Name ProcessCreationIncludeCmdLine_Enabled -Value 1 -Type DWord

      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: qualitylayer
        run: bun run build

      - name: Which PowerShell scripts one next starts
        working-directory: qualitylayer
        run: |
          $start = Get-Date
          bun scripts/diag-windows.ts trace
          Get-WinEvent -FilterHashtable @{LogName='Security';Id=4688;StartTime=$start} -ErrorAction SilentlyContinue | ForEach-Object {
            $line = [string]$_.Properties[8].Value
            $parent = Split-Path -Leaf ([string]$_.Properties[13].Value)
            if ($line -match '-EncodedCommand\s+(\S+)') {
              $code = [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($Matches[1]))
              $i = $code.IndexOf('ConvertFrom-Json; ')
              "$($_.TimeCreated.ToString('HH:mm:ss.fff')) [$parent] PS: " + $code.Substring([Math]::Max(0, $i + 18)).Substring(0, [Math]::Min(110, $code.Length - [Math]::Max(0, $i + 18)))
            } elseif ($line -notmatch 'conhost') { "$($_.TimeCreated.ToString('HH:mm:ss.fff')) [$parent] " + $line.Substring(0, [Math]::Min(140, $line.Length)) }
          }
