name: Windows diagnostics (temporary)
on:
  push:
    branches: [qa/beta58-win-install-probe]
permissions:
  contents: read
  actions: read
jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualitylayer-release-cli-1
          run-id: 39071362312
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
      - name: Inspect the retained CLI in disposable homes
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'release/qualitylayer-windows-x64.exe'
          $expected = ((Get-Content "$cli.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $cli -Algorithm SHA256).Hash -ne $expected) { throw 'Retained binary checksum mismatch' }
          $bytes = [IO.File]::ReadAllBytes($cli)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          $out = Join-Path $env:RUNNER_TEMP 'install-probe'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $rows = @()
          foreach ($mode in @('original', 'wait-json')) {
            $homeDir = Join-Path $out $mode
            New-Item -ItemType Directory -Path "$homeDir/.claude", "$homeDir/.codex" -Force | Out-Null
            $env:HOME = $homeDir
            $env:USERPROFILE = $homeDir
            $env:QUALITYLAYER_HOME = Join-Path $homeDir '.qualitylayer'
            $env:CLAUDE_CONFIG_DIR = Join-Path $homeDir '.claude'
            $env:CODEX_HOME = Join-Path $homeDir '.codex'
            $env:PI_CODING_AGENT_DIR = Join-Path $homeDir '.pi/agent'
            $env:OPENCODE_CONFIG_DIR = Join-Path $homeDir '.config/opencode'
            $env:XDG_CONFIG_HOME = Join-Path $homeDir '.config'
            $env:HTTP_PROXY = 'http://127.0.0.1:9'
            $env:HTTPS_PROXY = 'http://127.0.0.1:9'
            $env:ALL_PROXY = 'http://127.0.0.1:9'
            $env:QUALITYLAYER_NO_BROWSER = '1'
            $timer = [Diagnostics.Stopwatch]::StartNew()
            if ($mode -eq 'original') {
              & $cli install --non-interactive
              $code = $LASTEXITCODE
              $returnedMs = $timer.ElapsedMilliseconds
              $active = @(Get-Process -Name 'qualitylayer-windows-x64' -ErrorAction SilentlyContinue)
              $active | Wait-Process -Timeout 90 -ErrorAction SilentlyContinue
              $timedOut = @($active | Where-Object { -not $_.HasExited }).Count -gt 0
            } else {
              $stdout = Join-Path $out 'install.stdout.txt'
              $stderr = Join-Path $out 'install.stderr.txt'
              $p = Start-Process -FilePath $cli -ArgumentList @('install','--non-interactive','--json') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $timedOut = -not $p.WaitForExit(90000)
              if ($timedOut) { $p.Kill() }
              $code = $p.ExitCode
              $returnedMs = $timer.ElapsedMilliseconds
              Get-Content $stdout -Raw
              Get-Content $stderr -Raw
            }
            $files = @(Get-ChildItem -LiteralPath $homeDir -Recurse -Force -File | Select-Object -First 100 | ForEach-Object { [IO.Path]::GetRelativePath($homeDir,$_.FullName) })
            $rows += @{ mode=$mode; code=$code; returnedMs=$returnedMs; totalMs=$timer.ElapsedMilliseconds; timedOut=$timedOut; files=$files; expectedExists=(Test-Path "$homeDir/.qualitylayer/bin/qualitylayer.exe") }
          }
          @{ at=(Get-Date).ToUniversalTime().ToString('o'); subsystem=$subsystem; cases=$rows } | ConvertTo-Json -Depth 6 | Tee-Object -FilePath (Join-Path $out 'result.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: beta58-win-install-diagnostic
          path: |
            ${{ runner.temp }}/install-probe/*.json
            ${{ runner.temp }}/install-probe/*.txt
          retention-days: 7
