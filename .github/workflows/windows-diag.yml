name: Windows diagnostics (temporary)
on:
  push:
    branches: [qa/beta58-win-install-probe]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Diagnose beta.57 memory seeding in disposable homes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'old-memory-probe'
          New-Item -ItemType Directory -Path $out | Out-Null
          gh release download v12.0.0-beta.57 --repo maxritter/pilot-shell --pattern qualitylayer-windows-x64.exe --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir $out
          $cli = Join-Path $out 'qualitylayer-windows-x64.exe'
          $expected = ((Get-Content "$out/SHA256SUMS" | Where-Object { $_ -match '  qualitylayer-windows-x64.exe$' }) -split '  ')[0]
          if ((Get-FileHash $cli -Algorithm SHA256).Hash -ne $expected) { throw 'Previous official CLI checksum mismatch' }
          $env:GH_TOKEN = $null
          foreach ($mode in @('private-drive')) {
            $taskHome = Join-Path $out $mode
            New-Item -ItemType Directory -Path "$taskHome/project", "$taskHome/tmp" -Force | Out-Null
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            icacls $taskHome /inheritance:r /grant:r "*${sid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
            if (Test-Path 'Q:/') { throw 'Diagnostic drive is already occupied' }
            subst Q: $taskHome
            $taskHome = 'Q:/home'
            New-Item -ItemType Directory -Path "$taskHome/project", "$taskHome/tmp" -Force | Out-Null
            $env:HOME=$taskHome; $env:USERPROFILE=$taskHome
            $env:QUALITYLAYER_HOME=Join-Path $taskHome '.qualitylayer'
            $env:APPDATA=Join-Path $taskHome 'AppData/Roaming'; $env:LOCALAPPDATA=Join-Path $taskHome 'AppData/Local'
            $env:TMPDIR=Join-Path $taskHome 'tmp'; $env:TMP=$env:TMPDIR; $env:TEMP=$env:TMPDIR
            $env:CLAUDE_CONFIG_DIR=Join-Path $taskHome '.claude'; $env:CODEX_HOME=Join-Path $taskHome '.codex'
            $env:QUALITYLAYER_NO_BROWSER='1'; $env:QUALITYLAYER_NO_COCKPIT='1'; $env:QUALITYLAYER_API_BASE='http://127.0.0.1:9'
            if ($mode -eq 'compatible-modules') { $env:PSModulePath=$null }
            Push-Location "$taskHome/project"
            git init --quiet
            & $cli install --cli-only --non-interactive --json > "$out/$mode-install.stdout.txt" 2> "$out/$mode-install.stderr.txt"
            "install=$LASTEXITCODE" | Set-Content "$out/$mode-result.txt"
            & $cli memory store --title 'Preserved migration rule' --content 'Keep bounded migration locks and preserve catalog provenance.' --json > "$out/$mode-store.stdout.txt" 2> "$out/$mode-store.stderr.txt"
            "store=$LASTEXITCODE" | Add-Content "$out/$mode-result.txt"
            Pop-Location
            subst Q: /d
          }
          Get-Content "$out/*-result.txt", "$out/*-store.stdout.txt", "$out/*-store.stderr.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: beta58-win-legacy-memory-diagnostic
          path: ${{ runner.temp }}/old-memory-probe/*.txt
          retention-days: 7
