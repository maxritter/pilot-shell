name: supply-chain

# The release workflow waits for this check (by name) on the release commit.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  supply-chain:
    name: supply-chain
    permissions:
      contents: read
      # Only the nightly failure handler opens an issue.
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      # What the public repository serves: nothing under qualitylayer/ in plaintext.
      - name: Plaintext guard
        run: bash scripts/check_qualitylayer_encrypted.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"

      # package.json and bun.lock are plaintext on purpose, so this runs on the locked tree.
      - name: Lockfile is complete and unchanged
        working-directory: qualitylayer
        run: bun install --frozen-lockfile --ignore-scripts

      # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, no fixed release yet) reaches only build tools
      # (@tailwindcss/cli's watcher, the shadcn CLI), never the shipped binary; Max accepted it
      # on 2026-10-03. Drop the --ignore once braces ships a fix.
      - name: Known vulnerabilities in dependencies
        working-directory: qualitylayer
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Open issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Supply-chain: nightly scan failed (${new Date().toISOString().slice(0,10)})`,
              body: `Nightly supply-chain scan failed for ${context.sha}. See workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'supply-chain']
            });
