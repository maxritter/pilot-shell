# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration - https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"

  path_filters:
    # Exclude git-crypt encrypted directories from reviews (see .gitattributes)
    - "!qualitylayer/**"
    - "!docs/site/api/**"

  path_instructions:
    # install.sh runs as `curl | bash` on users' machines
    - path: "install.sh"
      instructions: |
        Review for fail-closed behaviour: the checksum must stay mandatory, nothing
        may be written before verification, and v11's unattended updater must never
        trigger the major upgrade.

    # GitHub workflows
    - path: ".github/workflows/**"
      instructions: |
        Review workflows for security best practices and proper permissions.

chat:
  auto_reply: true
