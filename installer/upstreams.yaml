    source_type: pypi
    source_url: https://github.com/certifi/python-certifi
    version: "2026.7.22"
    last_audited: "2026-08-19"

  - id: cryptography
    name: cryptography
    source_type: pypi
    source_url: https://github.com/pyca/cryptography
    version: "50.0.0"
    last_audited: "2026-08-19"

  - id: pyyaml
    name: PyYAML
    source_type: pypi
    source_url: https://github.com/yaml/pyyaml
    version: "6.0.3"
    last_audited: "2026-08-19"
